<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulador dos Minicasos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho fixo com abas por minicaso; cada minicaso é uma trilha de passos (explicação → controle → diagnóstico), com um painel de conceitos ao lado. */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --fg:#17202b; --muted:#5b6672; --line:#d9d6cf;
  --navy:#0b2545; --navy-ink:#ffffff; --terra:#b5462b; --terra-tint:#fbf0ea; --navy-tint:#e9eef5;
  --good:#1f6f43; --good-tint:#e6f3ea; --bad:#a3302a; --bad-tint:#fbe9e7; --warn:#8a5a00; --warn-tint:#fff3d6;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --ui:"Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14181e; --surface:#1d232b; --fg:#ebe9e3; --muted:#a3acb6; --line:#333b45;
  --navy:#9db8dc; --navy-ink:#0b1320; --terra:#e3876b; --terra-tint:#2d211c; --navy-tint:#1f2a3a;
  --good:#6cc48e; --good-tint:#16281d; --bad:#f08a80; --bad-tint:#331b19; --warn:#f0c060; --warn-tint:#33290f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14181e; --surface:#1d232b; --fg:#ebe9e3; --muted:#a3acb6; --line:#333b45;
  --navy:#9db8dc; --navy-ink:#0b1320; --terra:#e3876b; --terra-tint:#2d211c; --navy-tint:#1f2a3a;
  --good:#6cc48e; --good-tint:#16281d; --bad:#f08a80; --bad-tint:#331b19; --warn:#f0c060; --warn-tint:#33290f; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:0 48px;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);font-weight:700}
h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,30px);margin:0;color:var(--navy);text-wrap:balance}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:600 14px var(--ui);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--terra)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.tab .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy-tint);color:var(--navy);font-size:12px;line-height:20px;text-align:center;margin-right:6px}
.tab.done .n{background:var(--good);color:#fff}

section.case{display:none}
section.case.active{display:block}
.casehead{padding:28px 0 18px}
.casehead h2{font-family:var(--display);font-size:clamp(24px,3.4vw,34px);font-weight:600;margin:0 0 6px;color:var(--navy);text-wrap:balance}
.casehead .sub{color:var(--muted);font-style:italic;font-family:var(--display);font-size:17px;margin:0}
.lead{font-family:var(--display);font-size:18px;line-height:1.55;max-width:68ch;margin:10px 0 0}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
aside.concepts{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){aside.concepts{position:static}}
.concept{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy);padding:12px 14px;border-radius:4px}
.concept summary{cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);list-style:none}
.concept summary::-webkit-details-marker{display:none}
.concept summary::after{content:"+";float:right;color:var(--muted)}
.concept[open] summary::after{content:"–"}
.concept p{margin:8px 0 0;font-size:14px;line-height:1.5}
.concept .ref{color:var(--muted);font-size:12px}
.aside-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 2px}

.steps{display:flex;flex-direction:column;gap:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.step.locked{opacity:.55}
.step.locked .body{display:none}
.step-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.step-h .idx{font:700 12px var(--ui);letter-spacing:.08em;color:var(--terra);text-transform:uppercase}
.step-h h3{font-family:var(--display);font-size:20px;font-weight:600;margin:0;color:var(--fg)}
.explain{font-size:15px;max-width:70ch;margin:0 0 12px;color:var(--fg)}
.explain b{color:var(--navy)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;margin:8px 0 12px}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl label{font-size:13px;color:var(--muted);font-weight:600}
.ctl .val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
input[type=range]{width:100%;accent-color:var(--terra)}
input[type=number],select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 14px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn{border:0;background:var(--terra);color:#fff;font:700 14px var(--ui);padding:10px 16px;border-radius:4px;cursor:pointer}
.btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}

table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
th{background:var(--navy);color:var(--navy-ink);text-align:left;padding:7px 9px;font-weight:600;font-size:13px}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
tr.total td{font-weight:700;background:var(--navy-tint)}
td.ok{color:var(--good);font-weight:700} td.no{color:var(--bad);font-weight:700}

.diag{margin-top:12px;border-radius:4px;padding:12px 14px;border-left:4px solid var(--navy);background:var(--navy-tint);font-size:15px}
.diag.good{border-left-color:var(--good);background:var(--good-tint)}
.diag.bad{border-left-color:var(--bad);background:var(--bad-tint)}
.diag.warn{border-left-color:var(--warn);background:var(--warn-tint)}
.diag .t{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .v.good{color:var(--good)} .kpi .v.bad{color:var(--bad)}
.feedback{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:4px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--good-tint);color:var(--good)} .feedback.ko{background:var(--bad-tint);color:var(--bad)}
.quiz{display:flex;flex-direction:column;gap:8px}
.quiz .q{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.quiz .q .lbl{min-width:180px;font-weight:600}
.chart{width:100%;max-width:100%;height:auto;display:block;margin:8px 0}
.chart text{font-family:var(--ui);fill:var(--fg)}
.chart .axis{stroke:var(--line)} .chart .grid{stroke:var(--line);stroke-dasharray:2 3}
.lamina{border-top:4px solid var(--navy);background:var(--navy-tint);padding:14px 16px;border-radius:4px;display:grid;gap:10px}
.lamina h4{margin:0;font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.home .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.card .n{font:700 12px var(--ui);color:var(--terra);letter-spacing:.06em}
.card h3{font-family:var(--display);font-size:18px;margin:4px 0 4px;color:var(--navy)}
.card p{margin:0;font-size:14px;color:var(--muted)}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:18px}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:4px 0}
.ruler{font-family:var(--display);font-size:22px;color:var(--navy);text-align:center;padding:8px;background:var(--bg);border-radius:4px;font-variant-numeric:tabular-nums}
small.note{color:var(--muted);font-size:13px;display:block;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.step{transition:opacity .3s}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.tmsg{font-size:14px;color:var(--muted)}
.copyfb{width:100%;min-height:120px}
.flabel{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.ponte{display:flex;align-items:stretch;gap:6px;margin-top:6px;flex-wrap:wrap}
.pnode{flex:1 1 180px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:4px;padding:10px 12px;font-size:14px;min-width:0}
.pnode:last-child{border-top-color:var(--terra)}
.pnode .pl,.pitem .pl{font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin-bottom:2px}
.parrow{align-self:center;color:var(--terra);font-weight:700;font-size:20px}
@media (max-width:860px){.parrow{display:none}}
blockquote.objection{margin:0 0 10px;padding:14px 16px;border-left:4px solid var(--terra);background:var(--terra-tint);border-radius:4px}
blockquote.objection p{margin:0;font-family:var(--display);font-size:18px;font-style:italic}
blockquote.objection cite{display:block;margin-top:6px;font-style:normal;font-weight:700;font-size:13px;color:var(--terra)}
.hint{font-size:14px;color:var(--fg);margin:0 0 8px}
ul.checks{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:4px}
ul.checks li{color:var(--muted)} ul.checks li.ok{color:var(--good);font-weight:600}
.apostaecho{margin:0;font-size:14px}
.present{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:auto;padding:5vh 5vw;font-family:var(--ui)}
.present h2{font-family:var(--display);font-size:clamp(28px,4.2vw,56px);line-height:1.2;margin:8px 0 28px;color:#fff;text-wrap:balance}
.present .pk{font:700 clamp(14px,1.4vw,20px) var(--ui);letter-spacing:.1em;text-transform:uppercase;color:#ffcf5a;margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.pitem{border-top:3px solid #ffcf5a;padding-top:10px}
.present .pitem .pl{color:#ffcf5a;font-size:clamp(13px,1.2vw,17px)}
.pitem .pv{font-size:clamp(18px,2vw,28px);line-height:1.35}
.pclose{position:fixed;top:12px;right:12px;background:#fff;color:#000;border:0;font:700 15px var(--ui);padding:8px 14px;border-radius:4px;cursor:pointer}
.subh{margin:18px 0 4px;font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.desafio{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.desafio .dq{margin:0 0 8px;font-size:15px}
.pontecard{background:var(--navy-tint);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px;padding:16px 18px}
.pontecard .pl{font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--terra)}
.pontecard .pq{font-family:var(--display);font-size:18px;font-style:italic;margin:6px 0 8px}
</style>

<header class="top"><div class="in">
  <div class="kicker">Operações, Risco e Capital · Sessão 1 · Desenho da cadeia e capital</div>
  <h1>Simulador dos Minicasos</h1>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>

<div class="wrap" id="app"></div>

<script>
// ============ utilidades ============
const fmt=(v,d=1)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>fmt(v,d)+'%';
const money=(v,d=0)=>'R$ '+fmt(v,d)+' mi';
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!=null)e.setAttribute(k,v)}kids.flat().forEach(k=>{if(k==null)return;e.append(k.nodeType?k:document.createTextNode(k))});return e};
const store={get(k,d){try{const v=localStorage.getItem('sim1:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sim1:'+k,JSON.stringify(v))}catch(e){}}};
// Φ da normal padrão (Abramowitz-Stegun)
function Phi(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}

// ============ definição dos minicasos ============
const CASES=[];
const GRUPO={vitta:1,autopar:null,bompreco:2,embalagens:3,vida:4};
const gl=c=>GRUPO[c.id]?'Grupo '+GRUPO[c.id]:'Plenária';

// ---------- 0 · Início ----------
const home={id:'home',tab:'Início',render(root){
  root.append(el('div',{class:'home'},
    el('div',{class:'casehead'},el('h2',{},'Cinco empresas, cinco decisões'),
      el('p',{class:'lead'},'Cada minicaso é uma trilha: a aposta do grupo, as contas, o contra-argumento de quem discorda e, no fim, uma nota executiva ao Conselho. Em cada passo vocês leem o conceito, mexem nos números e veem o diagnóstico mudar. A pergunta de fundo é sempre a mesma: que decisão de operação muda qual número de finanças, e quanto isso vale?')),
    el('div',{class:'cards'},...CASES.slice(1).map((c,i)=>el('button',{class:'card',onclick:()=>go(i+1)},el('div',{class:'n'},'MINICASO '+(i+1)+' · '+gl(c).toUpperCase()),el('h3',{},c.empresa),el('p',{},c.tema)))),
    el('div',{class:'howto'},el('strong',{},'Como usar na salinha'),
      el('ol',{},el('li',{},'Leiam o minicaso impresso primeiro. A ferramenta não substitui a leitura; ela ajuda a fazer e a entender as contas.'),
        el('li',{},'São quatro grupos: Vitta (Grupo 1), Bom Preço (Grupo 2), Embalagens Sul (Grupo 3) e Farmácias Vida (Grupo 4). A Autopar é resolvida em plenária, com o professor e o simulador projetado.'),
        el('li',{},'Abram o minicaso do grupo. Os passos seguem as perguntas do enunciado. Cada passo libera o seguinte.'),
        el('li',{},'Mexam nos controles. O diagnóstico muda na hora, e é assim que vocês testam a premissa: o que precisa ser verdade para a recomendação se inverter?'),
        el('li',{},'O painel Conceitos, ao lado, traz a teoria do ponto de aprendizagem. Use quando travar.'),
        el('li',{},'Antes das contas, registrem a aposta do grupo. Depois de calcular, enfrentem o contra-argumento de um executivo e escrevam a nota ao Conselho.'),
        el('li',{},'Use os botões no topo de cada minicaso para baixar ou copiar a nota do grupo e para projetá-la em tela cheia.')),
      el('small',{class:'note'},'Os números são os do caderno de minicasos. O que o grupo escreve fica guardado só neste navegador; para entregar ou levar adiante, baixe ou copie a nota.')),
    (()=>{const msg=el('span',{class:'tmsg',role:'status'});const bar=el('div',{class:'toolbar'});bar.append(el('button',{class:'btn secondary',onclick:()=>baixar(CASES.slice(1),'notas-conselho-sessao-1.html',msg,bar)},'Exportar os cinco minicasos juntos (professor)'));bar.append(el('button',{class:'btn secondary',onclick:()=>copiar(CASES.slice(1).map(notaTexto).join('\n\n'),msg,bar)},'Copiar as cinco notas'),msg);return bar})()));
}};

// ---------- 1 · Vitta ----------
CASES.push(home);
CASES.push({id:'vitta',tab:'Vitta',empresa:'Vitta Cosméticos',tema:'Que cadeia, quanto capital',
 titulo:'Vitta Cosméticos: o benchmark que veio da distribuidora',
 frase:'Um CFO recém-chegado quer que uma fabricante de cosméticos gire o capital como a distribuidora de onde ele veio. Avalie o plano dele frente a frente.',
 concepts:[
  ['Retorno é margem vezes giro','O retorno sobre o capital responde: para cada R$ 100 presos na operação, quanto a empresa lucra por ano? É a margem (lucro ÷ receita) vezes o giro (receita ÷ capital). Margem alta com giro baixo e margem baixa com giro alto podem dar o mesmo retorno.','Notas 1.2 e 1.5'],
  ['O giro depende do que a empresa precisa ter','Uma fabricante mantém fábricas; uma distribuidora compra pronto e revende. Por isso a fabricante gira mais devagar, mesmo com o mesmo estoque. Comparar o giro das duas sem a margem é comparar metade de cada conta.','Notas 1.6'],
  ['O produto escolhe a cadeia','Produto funcional (demanda previsível, margem baixa) pede cadeia eficiente, com pouco estoque. Produto inovador (demanda imprevisível, margem alta) pede cadeia responsiva, que aceita estoque para não perder a venda.','Fisher · Notas 1.3'],
  ['A promessa ao cliente','Quem vence é 5 em um atributo, 4 em outro e 3 nos demais: preço, produto, acesso, serviço, experiência. Cada atributo prende capital de um jeito. Cortar capital onde ele sustenta a promessa custa margem.','Notas 1.4'],
 ],
 state:{mV:16,gV:1.1,mD:4,gD:4.0, f1:true,f2:true,f3:true, c1:4,c2:3,c3:2, q2a:null,q2b:null, rec:'',prem:''},
 steps:[
  {t:'Pergunta 1 · O retorno de cada empresa',
   explain:'A Vitta prende R$ 1.000 mi (670 em fábricas, 150 em estoque, 180 a receber) e vende R$ 1.100 mi: giro de 1,1. A DistriMax não tem fábrica e gira 4,0. Multiplique margem por giro e compare. Mude os controles para ver quando uma ultrapassa a outra.',
   body(s,S,rerender){
    const r=el('div');
    r.append(el('div',{class:'controls'},slider('Margem da Vitta',S,'mV',4,25,0.5,v=>pct(v,1),rerender),slider('Giro da Vitta',S,'gV',0.5,4,0.1,v=>fmt(v,1),rerender),slider('Margem da DistriMax',S,'mD',1,12,0.5,v=>pct(v,1),rerender),slider('Giro da DistriMax',S,'gD',1,6,0.1,v=>fmt(v,1),rerender)));
    const rv=S.mV*S.gV, rd=S.mD*S.gD;
    r.append(el('div',{class:'kpis'},kpi('Retorno Vitta',pct(rv)),kpi('Retorno DistriMax',pct(rd)),kpi('Diferença',(rv>=rd?'+':'')+fmt(rv-rd)+' p.p.',rv>=rd?'good':'bad')));
    r.append(isoChart([{x:S.gV,y:S.mV,l:'Vitta'},{x:S.gD,y:S.mD,l:'DistriMax'}],[10,15,20]));
    r.append(diag(rv>=rd?'good':'warn',rv>=rd?'A Vitta rende mais':'A DistriMax rende mais',
      rv>=rd?`Girando a um quarto da velocidade, a Vitta rende ${pct(rv)} contra ${pct(rd)}. As duas estão perto da mesma linha de retorno. O giro baixo vem sobretudo das fábricas (67% do capital), não do estoque. Marcos não tem razão: giro baixo não é ineficiência quando a margem paga por ele.`

function slider(label,S,key,min,max,step,f,rerender){
  const id='in-'+key;
  const val=el('span',{class:'val'},f(S[key]));
  const inp=el('input',{type:'range',id,min,max,step,value:S[key],oninput:e=>{S[key]=+e.target.value;val.textContent=f(S[key])},onchange:e=>{S[key]=+e.target.value;rerender(true)}});
  return el('div',{class:'ctl'},el('label',{for:id},label,' ',val),inp);
}
function kpi(l,v,cls=''){return el('div',{class:'kpi'},el('div',{class:'l'},l),el('div',{class:'v '+cls},v))}
function diag(kind,title,text){return el('div',{class:'diag '+kind},el('span',{class:'t'},title),text)}
function quiz(label,S,key,opts,ans,rerender,okText,koText){
  const q=el('div',{class:'q'},el('span',{class:'lbl'},label));
  const chips=el('div',{class:'chips'},...opts.map(o=>el('button',{class:'chip','aria-pressed':String(S[key]===o),onclick:()=>{S[key]=o;rerender()}},o)));
  const fb=el('div',{class:'feedback'+(S[key]?' show '+(S[key]===ans?'ok':'ko'):'')},S[key]?(S[key]===ans?okText:koText):'');
  return el('div',{},q,chips,fb);
}
function isoChart(points,levels){
  const W=560,H=300,px=56,py=20,xmax=4.5,ymax=22;
  const X=x=>px+(x/xmax)*(W-px-16), Y=y=>H-py-18-(y/ymax)*(H-py-38);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','chart');
  const S=(n,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};
  levels.forEach(r=>{let d='';for(let x=0.5;x<=xmax;x+=0.05){const y=r/x;if(y>ymax)continue;d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)}const p=S('path',{d,fill:'none',stroke:'var(--line)','stroke-width':r===15?2.5:1.2,'stroke-dasharray':r===15?'':'3 3'});if(r===15)p.setAttribute('stroke','var(--navy)');svg.append(p);const t=S('text',{x:X(xmax)-4,y:Y(r/xmax)-4,'font-size':'11','text-anchor':'end',fill:'var(--muted)'});t.textContent='retorno '+r+'%';svg.append(t)});
  svg.append(S('line',{x1:px,y1:Y(0),x2:X(xmax),y2:Y(0),class:'axis'}));svg.append(S('line',{x1:px,y1:Y(0),x2:px,y2:Y(ymax),class:'axis'}));
  [1,2,3,4].forEach(v=>{const t=S('text',{x:X(v),y:H-4,'font-size':'11','text-anchor':'middle'});t.textContent=fmt(v,0);svg.append(t)});
  [5,10,15,20].forEach(v=>{const t=S('text',{x:px-6,y:Y(v)+4,'font-size':'11','text-anchor':'end'});t.textContent=v+'%';svg.append(t)});
  const xl=S('text',{x:(px+W)/2,y:H-4,'font-size':'11','text-anchor':'middle',fill:'var(--muted)'});xl.textContent='';svg.append(xl);
  const yl=S('text',{x:14,y:12,'font-size':'11',fill:'var(--muted)'});yl.textContent='margem · eixo horizontal: giro';svg.append(yl);
  points.forEach(p=>{if(p.y>ymax||p.x>xmax)return;svg.append(S('circle',{cx:X(p.x),cy:Y(p.y),r:7,fill:'var(--terra)',stroke:'var(--surface)','stroke-width':2}));const t=S('text',{x:X(p.x)+10,y:Y(p.y)-8,'font-size':'12','font-weight':'700'});t.textContent=p.l+' '+pct(p.x*p.y);svg.append(t)});
  return svg;
}
function barChart(items,unit=''){
  const W=560,H=160,px=120,gap=10;const max=Math.max(...items.map(i=>Math.abs(i[1])),1);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','chart');
  const S=(n,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};
  const zero=px+(W-px-70)/2, sc=(W-px-70)/2/max; const bh=(H-20)/items.length-gap;
  svg.append(S('line',{x1:zero,y1:8,x2:zero,y2:H-8,class:'axis'}));
  items.forEach(([n,v],i)=>{const y=10+i*(bh+gap);const w=Math.abs(v)*sc;svg.append(S('rect',{x:v>=0?zero:zero-w,y,width:w,height:bh,fill:v>=0?'var(--good)':'var(--bad)',rx:2}));const t=S('text',{x:px-8,y:y+bh/2+4,'font-size':'12','text-anchor':'end','font-weight':'600'});t.textContent=n;svg.append(t);const tv=S('text',{x:v>=0?zero+w+6:zero-w-6,y:y+bh/2+4,'font-size':'12','text-anchor':v>=0?'start':'end'});tv.textContent=(v>=0?'+':'')+fmt(v,1)+unit;svg.append(tv)});
  return svg;
}

  ref:{decisao:'Não aprovar 120 lojas no mesmo modelo. Crescer em fases, com menos capital por loja.',razao:'Cada loja nova exige reforma, equipamento e estoque inicial antes de vender; o sortimento ampliado gira devagar em todas as 320 lojas.',num:'Cada R$ 100 de capital novo trouxe R$ 7,50 de lucro, contra R$ 12 de custo: R$ 36 mi por ano de valor perdido.',prem:'A maturação das lojas novas: se o lucro novo chegar a R$ 96 mi por ano, o crescimento empata.',gatilho:'Tiago apresenta o retorno por safra de lojas. Se a safra mais antiga não estiver a caminho de 12% sobre o capital investido, a fase seguinte não começa.',pedido:'Que o Conselho aprove o plano em fases, condicionado ao retorno do capital novo e não ao lucro total.'}},
};
const EXTRA=[{"desafios":[["E se a terceirização custar os 4 pontos de margem que Lúcia estima e, além disso, atrasar um em cada quatro lançamentos, tirando 5% da receita?","Capital de 715, receita de 1.045: giro de 1,46. Margem de 12%. Retorno de 17,5%, contra 17,6% hoje. A frente que criava valor passa a empatar, ligeiramente abaixo. A lição: a perda de margem e a perda de receita somam-se, e a velocidade de lançamento (o 5 da promessa) é a premissa escondida atrás da estimativa de Lúcia."],["O minicaso mantém a receita constante quando se cortam 150 itens. E se o catálogo menor tirar 10% da receita?","Só a frente do catálogo: capital de 925, receita de 990, giro de 1,07; margem de 13%; retorno de 13,9%, contra 15,5% com a receita constante e 17,6% hoje. A simplificação do minicaso favorece o plano de Marcos; corrigida, o plano fica pior, não melhor."]],"atrito":["Marcos chegou há três semanas e precisa mostrar resultado. Renata vai discordar do novo CFO na primeira reunião de diretoria. Como ela faz isso sem transformar a reunião numa disputa?","Começar pelo que concorda (há capital demais em alguns lugares); trocar a meta de giro por uma meta de retorno, que Marcos também pode defender; oferecer a ele a frente que funciona, a terceirização, como piloto. Quem vence a discussão sem dar uma vitória ao outro perde a implementação."],"ponte":["Ponte para o minicaso 2","A Vitta mostrou que o capital de uma fabricante está nas fábricas. Numa distribuidora, ele está quase todo no estoque. Se o CFO mandar cortar um quarto dele, onde vocês cortariam?","A pergunta leva a turma a responder “no estoque de segurança”, que é exatamente a armadilha da Autopar."]},{"desafios":[["E se os atacadistas pagarem só 30% do valor do obsoleto, e não metade?","O obsoleto rende R$ 9 mi de caixa (e R$ 21 mi de perda contábil). Com os 30 do ciclo, chega-se a 39: faltam 6. Ou se cortam 12% da reserva, e a disponibilidade cai de 98% para cerca de 96,5%, ou se renegocia a meta. A discussão que importa: vale mais cumprir a meta do CFO ou a promessa às oficinas? Quem decide, e com que número?"],["A reserva supõe prazo de reposição constante. E se o navio atrasar com frequência?","A reserva calculada fica pequena demais: a variação do prazo também precisa de cobertura. A disponibilidade real já seria menor que 98%, e cortar a reserva seria ainda mais caro do que a tabela mostra. É o argumento mais forte contra a proposta de Carla."]],"atrito":["Henrique é cobrado por preço, Paula por receita, Carla pela meta de estoque. Como Luís faz Henrique aceitar entregas mensais sem sentir que perde o bônus?","Mostrar a Henrique o custo total, não só o preço: os R$ 30 mi de estoque de ciclo a mais custam R$ 3,6 mi por ano de capital (12%), um custo que hoje ninguém cobra dele. A saída é dividir a meta por dono da espera e medir compras pelo custo total. E o CFO precisa aceitar a perda contábil fora da meta de Paula."],"ponte":["Ponte para o minicaso 3","A Autopar liberou caixa fazendo a peça esperar menos. Há outro jeito de mover o mesmo indicador sem tocar na espera: mudar quem paga por ela. É a mesma coisa?","A turma tende a dizer que sim, porque o indicador melhora igual. O Bom Preço mostra que não é."]},{"desafios":[["Supusemos que o Laticínio São Bento repassa os 20% inteiros no preço. E se, com medo de perder a rede, ele repassar só metade?","A rede passa a pagar R$ 9 mi por ano, não 18: a Opção A vai de −7,2 para +1,8. A decisão não se inverte (B rende +7,8), mas A deixa de destruir valor para a rede. Os outros R$ 9 mi por ano não somem: o fornecedor os absorve a 20%, e é aí que mora o risco de perdê-lo. A rede “ganha” transferindo prejuízo a quem é mais frágil na cadeia."],["E se o fornecedor fosse uma multinacional com custo de capital de 8%?","A Opção A rende 10,8 − 7,2 = +3,6 por ano: cria valor, mas ainda menos que B (+7,8). Alongar prazo com quem tem dinheiro mais barato é legítimo; o erro é aplicar a mesma regra a todos os fornecedores."]],"atrito":["Fernanda é cobrada pelo capital de giro, e o prazo maior bate a meta dela no mês seguinte. A reposição automática leva um ano e tira dos gerentes de loja o poder de pedir. Quem perde com a Opção B, e como se lida com isso?","Os gerentes perdem autonomia e passam a ser cobrados por algo que não controlam mais; a métrica deles precisa mudar junto (ruptura medida pelo sistema, não pela intuição). Fernanda pode usar o risco sacado como ponte de curto prazo enquanto B é implantada. Sem mudar as métricas, B fracassa por resistência, não por conta."],"ponte":["Ponte para o minicaso 4","No Bom Preço, a reposição automática custa R$ 20 mi uma vez e R$ 3 mi por ano, e libera R$ 90 mi. Como comparar um custo anual com um capital liberado sem misturar as unidades?","É exatamente o problema do comitê da Embalagens Sul, e a régua é a resposta."]},{"desafios":[["E se o custo de capital da empresa fosse 8%, e não 12%?","A régua sobe para 0,66 ÷ 0,08 = 8,25. A passa a valer 6 × 8,25 − 20 = 29,5; B, 40 − 4 − 2 × 8,25 = 19,5. A decisão se inverte: com dinheiro barato, lucro recorrente vale mais e capital liberado vale menos. O empate fica em cerca de 9,4%. A escolha entre os projetos depende do custo de capital, um número que operações raramente pergunta."],["O minicaso supõe que a liberação é permanente. E se a empresa crescer 20% ao ano?","Pela lei de Little, o estoque acompanha as vendas: o que o S&OP reduz são os dias de espera, não um valor fixo em reais. Com vendas 20% maiores, a diferença entre ter e não ter o S&OP passa de 40 para cerca de 48. O crescimento não apaga o ganho; aumenta. O que apaga é o processo deixar de funcionar."]],"atrito":["Ricardo foi treinado a vida inteira para olhar o payback. Como Patrícia leva o S&OP a ele sem parecer que está dizendo que a métrica dele está errada?","Falar a língua dele: os R$ 40 mi liberados deixam de custar 12% ao ano, ou seja, R$ 4,8 mi por ano de custo de capital evitado, comparável aos R$ 6 mi de economia da máquina. Ou, pelo valor econômico anual, 3,0 contra 1,56. E oferecer a ele o que mais valoriza: uma meta verificável e uma cláusula de revisão."],"ponte":["Ponte para o minicaso 5","A régua acabou de aprovar um projeto que devolve capital ao caixa. E quando o capital entra, em vez de sair? Uma empresa que cresce 50% e bate recorde de lucro está criando valor?","A turma, com a régua fresca, já desconfia da resposta; a Vida mostra onde o capital novo foi parar."]},{"desafios":[["Se a Vida cortasse pela metade os dias de estoque do sortimento ampliado, sem perder lucro, o crescimento empataria?","Pela lei de Little, metade dos dias libera cerca de metade dos R$ 245 mi, uns R$ 122 mi. O capital novo cai para cerca de 678, e o retorno sobe para 60 ÷ 678 = 8,9%, ainda abaixo de 12%. Para empatar com o lucro de hoje, o capital novo teria de ser no máximo R$ 500 mi: o grosso do ajuste está nas lojas (480), não no sortimento."],["Tiago diz que o lucro novo chegará a R$ 96 mi. Em que ano isso precisa acontecer para o argumento valer?","Enquanto não chega, cada ano custa a diferença: R$ 36 mi no primeiro, menos nos seguintes. Uma promessa de empate sem data é uma promessa sem custo para quem a faz. A pergunta transforma o argumento de Tiago num compromisso com prazo, exatamente o que Beatriz pediu."]],"atrito":["Rogério é o CEO, o lucro é recorde e a marca é a mais lembrada da região. Como Beatriz faz a pergunta sobre o capital sem parecer que é contra crescer?","Enquadrar como crescer melhor, não como frear: aprovar em fases, pedir o retorno por safra de lojas e condicionar a fase seguinte ao número. Vale perguntar também o que mede hoje o sucesso de Tiago, lojas abertas ou retorno da safra, porque é isso que ele vai entregar."],"ponte":["Ponte para o fechamento","Cinco empresas, cinco setores. Em todas, a conta foi curta. O que decidiu cada uma?","A turma deve chegar sozinha à resposta: uma premissa de operação, convertida em valor por finanças. É a frase que fecha a sessão."]}];
['vitta','autopar','bompreco','embalagens','vida'].forEach((k,i)=>{const x=EXTRA[i];META[k].desafios=x.desafios;META[k].atrito=x.atrito;META[k].transicao=x.ponte});
const NOTA=[['decisao','Decisão','Em uma frase: o que o grupo recomenda?'],['razao','Razão operacional','Que mecanismo da operação sustenta a decisão? Onde o tempo, o capital ou a margem mudam?'],['num','O número','Quanto vale, em reais ou em pontos de retorno?'],['prem','A premissa crítica','O que precisa ser verdade? Se estiver errado, a decisão se inverte.'],['gatilho','Gatilho de revisão','Que indicador, em que prazo, com que limite faz o grupo rever a decisão?'],['pedido','Pedido ao Conselho','O que a decisão exige, e de quem?']];

function apostaStep(c){return {t:GRUPO[c.id]?'A aposta do grupo':'A aposta da turma',
 explain:'Antes de qualquer conta, registrem a intuição. Executivos decidem com intuição o tempo todo; o que os diferencia é saber quando os números a contrariam. No fim do minicaso, vocês comparam a aposta com a decisão.',
 body(s,S,rerender){

  r.append(el('div',{class:'q'},el('span',{class:'lbl'},'Com que convicção?')));
  r.append(el('div',{class:'chips'},...['Pouca','Média','Muita'].map(o=>el('button',{class:'chip','aria-pressed':String(S.conv===o),onclick:()=>{S.conv=o;rerender(true)}},o))));
  r.append(el('label',{class:'flabel',for:'ap-'+s},'Por quê, em uma frase'),el('textarea',{id:'ap-'+s,placeholder:'O argumento que convenceu o grupo, antes das contas.',oninput:e=>{S.apostaPor=e.target.value;store.set('state:'+s,S)}},S.apostaPor||''));
  if(S.aposta) r.append(diag('','Aposta registrada',`“${S.aposta}”${S.conv?', com '+S.conv.toLowerCase()+' convicção':''}. Agora façam as contas. Se elas contrariarem a aposta, ótimo: é a discussão que a sala quer ouvir.`));
  return r;
 }};}

function contraStep(c){return {t:'O contra-argumento',
 explain:'Uma boa recomendação sobrevive à objeção mais forte de quem discorda. Leiam a fala, respondam por escrito em até três frases e só depois comparem com a resposta de referência. Uma resposta de executivo concorda com o que é verdade, traz o mecanismo e termina num número.',
 body(s,S,rerender){
  const m=META[c.id].contra; const r=el('div');
  r.append(el('blockquote',{class:'objection'},el('p',{},'“'+m.fala+'”'),el('cite',{},m.quem)));
  r.append(el('p',{class:'hint'},el('b',{},'Pista. '),m.dica));
  r.append(el('label',{class:'flabel',for:'ct-'+s},'Resposta do grupo'),el('textarea',{id:'ct-'+s,placeholder:'Concordem com o que é verdade, mostrem o mecanismo, terminem num número.',oninput:e=>{S.contra=e.target.value;store.set('state:'+s,S);btn.disabled=words(S.contra)<12}},S.contra||''));
  const out=el('div');
  const btn=el('button',{class:'btn secondary',onclick:()=>{S.contraVer=true;rerender(true)}},'Ver uma resposta de referência');
  btn.disabled=words(S.contra)<12;
  r.append(el('div',{class:'row'},btn,el('small',{class:'note',style:'margin:0'},'Libera depois que o grupo escrever ao menos uma frase completa.')));
  if(S.contraVer) r.append(diag('good','Uma resposta possível',m.modelo));
  const at=META[c.id].atrito;
  r.append(el('h4',{class:'subh'},'Quem perde com a decisão?'),el('p',{class:'hint'},'A conta fecha; agora a empresa. Toda decisão tira algo de alguém: uma meta, um bônus, um poder. Se ninguém cuidar disso, a decisão certa trava na implementação.'),
   el('blockquote',{class:'objection'},el('p',{},'“'+at[0]+'”')),
   el('label',{class:'flabel',for:'at-'+s},'Como o grupo lida com isso'),el('textarea',{id:'at-'+s,placeholder:'Quem perde, o que muda na métrica dessa pessoa, e o que se oferece em troca.',oninput:e=>{S.atrito=e.target.value;store.set('state:'+s,S);ab.disabled=words(S.atrito)<8}},S.atrito||''));
  const ab=el('button',{class:'btn secondary',onclick:()=>{S.atritoVer=true;rerender(true)}},'Ver o que um executivo responderia');ab.disabled=words(S.atrito)<8;
  r.append(el('div',{class:'row'},ab));
  if(S.atritoVer) r.append(diag('good','O que se espera ouvir',at[1]));
  r.append(out); return r;
 }};}

function notaStep(c){return {t:'A nota ao Conselho',
 explain:'Seis linhas que um conselheiro lê em um minuto. A <b>decisão</b> vem primeiro; a <b>razão operacional</b> diz o mecanismo; o <b>número</b> diz quanto vale; a <b>premissa</b> e o <b>gatilho</b> dizem o que faria o grupo mudar de ideia; o <b>pedido</b> diz o que a decisão exige. Escrevam a de vocês antes de comparar.',
 body(s,S,rerender){
  const N=S.nota=S.nota||{}; const m=META[c.id]; const r=el('div',{class:'lamina'});
  const checks=el('ul',{class:'checks'});
  const paint=()=>{checks.innerHTML='';
   [[words(N.decisao)>0&&words(N.decisao)<=30&&!/talvez|depende/i.test(N.decisao),'A decisão cabe em uma frase (até 30 palavras) e não diz “depende”'],
    [words(N.razao)>=8,'A razão diz o mecanismo da operação, não um adjetivo'],
    [hasNum(N.num),'O número está em reais ou em pontos de retorno'],
    [words(N.prem)>=6,'A premissa diz o que, se estiver errado, inverte a decisão'],
    [hasNum(N.gatilho),'O gatilho tem indicador, prazo e limite (com número)'],
    [words(N.pedido)>=5,'O pedido diz o que é preciso, e de quem']].forEach(([ok,t])=>checks.append(el('li',{class:ok?'ok':''},(ok?'✓ ':'○ ')+t)));
   cmp.disabled=!(words(N.decisao)>0&&hasNum(N.num));};
  r.append(el('h4',{},'Integrantes do grupo'),el('input',{type:'text',id:'nt-int-'+s,placeholder:'Nomes de quem fez este minicaso',value:S.integrantes||'',oninput:e=>{S.integrantes=e.target.value;store.set('state:'+s,S)}}));
  NOTA.forEach(([k,l,ph])=>{r.append(el('h4',{},l),el('textarea',{id:'nt-'+k+'-'+s,placeholder:ph,oninput:e=>{N[k]=e.target.value;store.set('state:'+s,S);paint()}},N[k]||''))});
  if(S.aposta){r.append(el('h4',{},'A aposta e a decisão'),el('p',{class:'apostaecho'},`O grupo apostou: “${S.aposta}”${S.conv?' ('+S.conv.toLowerCase()+' convicção)':''}. A decisão final confirma ou contraria a aposta? O que fez mudar?`),el('textarea',{id:'nt-mudou-'+s,placeholder:'Uma frase.',oninput:e=>{S.mudou=e.target.value;store.set('state:'+s,S)}},S.mudou||''))}
  const cmp=el('button',{class:'btn secondary',onclick:()=>{S.refVer=!S.refVer;rerender(true)}},S.refVer?'Esconder a referência':'Comparar com a referência');
  r.append(el('h4',{},'Teste do executivo'),checks,el('div',{class:'row'},cmp,el('small',{class:'note',style:'margin:0'},'Libera quando a decisão e o número estiverem escritos.')));
  paint();
  if(S.refVer){const tb=el('table');tb.append(el('tr',{},el('th',{},'Item'),el('th',{},'Referência')));NOTA.forEach(([k,l])=>tb.append(el('tr',{},el('td',{},el('b',{},l)),el('td',{},m.ref[k]))));
   r.append(el('div',{class:'tscroll'},tb),el('small',{class:'note'},'A referência não é a única resposta certa. Uma decisão diferente vale se o número e a premissa a sustentarem.'))}
  {const msg=el('span',{class:'tmsg',role:'status'});const bar=el('div',{class:'toolbar'});bar.append(exportBtn(c,msg,bar),el('button',{class:'btn secondary',onclick:()=>copiar(notaTexto(c),msg,bar)},'Copiar a nota'),msg);r.append(el('h4',{},'Entregar'),el('small',{class:'note',style:'margin:0'},'O arquivo traz só este minicaso: a nota ao Conselho e o percurso do grupo (aposta, contra-argumento, quem perde, desafios).'),bar)}
  return r;
 }};}

function desafioStep(c){return {t:'Desafio extra · opcional',
 explain:'Para o grupo que terminou antes. Todo modelo simplifica; aqui as simplificações viram perguntas. Mudem uma premissa e vejam se a decisão do grupo sobrevive. Respondam com a conta antes de abrir a resposta.',
 body(s,S,rerender){const r=el('div');S.desafio=S.desafio||{};S.desafioVer=S.desafioVer||{};
  META[c.id].desafios.forEach(([q,a],i)=>{
   const b=el('button',{class:'btn secondary',onclick:()=>{S.desafioVer[i]=true;rerender(true)}},'Ver o que a turma deve encontrar');b.disabled=words(S.desafio[i])<5;
   r.append(el('div',{class:'desafio'},el('p',{class:'dq'},el('b',{},'Desafio '+(i+1)+'. '),q),
    el('textarea',{id:'df'+i+'-'+s,placeholder:'A conta e a conclusão: o que muda na decisão do grupo?',oninput:e=>{S.desafio[i]=e.target.value;store.set('state:'+s,S);b.disabled=words(S.desafio[i])<5}},S.desafio[i]||''),
    el('div',{class:'row'},b),S.desafioVer[i]?diag('good','Resposta',a):null))});

function ponteCard(c){const p=META[c.id].transicao;const i=CASES.indexOf(c);const nx=i+1<CASES.length?i+1:null;
 return el('div',{class:'pontecard'},el('div',{class:'pl'},p[0]),el('p',{class:'pq'},'“'+p[1]+'”'),el('p',{class:'hint'},p[2]),nx?el('div',{class:'row'},el('button',{class:'btn secondary',onclick:()=>{go(nx);window.scrollTo(0,0)}},'Ir para o minicaso '+nx+' · '+CASES[nx].empresa)):null)}

let DL=null; // namespace de downloads, se disponível
const esc=t=>String(t||'').replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
function notaTexto(c){const S=c.state,N=S.nota||{};let t=`MINICASO ${CASES.indexOf(c)} · ${gl(c).toUpperCase()} · ${c.empresa.toUpperCase()}\n${c.titulo}\nINTEGRANTES: ${S.integrantes||'—'}\n\n`;
 NOTA.forEach(([k,l])=>t+=`${l.toUpperCase()}: ${N[k]||'—'}\n`);
 t+=`\nQUEM PERDE COM A DECISÃO: ${S.atrito||'—'}\n`;(META[c.id].desafios||[]).forEach(([q],i)=>{if(S.desafio&&S.desafio[i])t+=`DESAFIO ${i+1}: ${S.desafio[i]}\n`});
 t+=`\nAPOSTA INICIAL: ${S.aposta||'—'}${S.conv?' ('+S.conv.toLowerCase()+' convicção)':''}\nPOR QUÊ: ${S.apostaPor||'—'}\nO QUE MUDOU: ${S.mudou||'—'}\n\nRESPOSTA AO CONTRA-ARGUMENTO (${META[c.id].contra.quem}): ${S.contra||'—'}\n`;return t}
function notaHTML(c){const S=c.state,N=S.nota||{},i=CASES.indexOf(c);
