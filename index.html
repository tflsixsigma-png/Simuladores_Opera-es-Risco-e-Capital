// Φ da normal padrão (Abramowitz-Stegun)
function Phi(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}

const EXTRA=[{"desafios":[["E se a terceirização custar os 4 pontos de margem que Lúcia estima e, além disso, atrasar um em cada quatro lançamentos, tirando 5% da receita?","Capital de 715 (1.000 − 285), receita de 1.045 (1.100 menos 5%): giro de 1,46 (1.045 ÷ 715). Margem de 12% (16 − 4). Retorno de 17,5% (12% × 1,46), contra 17,6% hoje. A frente que criava valor passa a empatar, ligeiramente abaixo. A lição: a perda de margem e a perda de receita somam-se, e a velocidade de lançamento (o 5 da promessa) é a premissa escondida atrás da estimativa de Lúcia."],["O minicaso mantém a receita constante quando se cortam 150 itens. E se o catálogo menor tirar 10% da receita?","Só a frente do catálogo: capital de 925 (1.000 − 75), receita de 990 (1.100 menos 10%), giro de 1,07 (990 ÷ 925); margem de 13% (16 − 3); retorno de 13,9% (13% × 1,07), contra 15,5% com a receita constante (13% × 1,19) e 17,6% hoje. A simplificação do minicaso favorece o plano de Marcos; corrigida, o plano fica pior, não melhor."]],"atrito":["Marcos chegou há três semanas e precisa mostrar resultado. Renata vai discordar do novo CFO na primeira reunião de diretoria. Como ela faz isso sem transformar a reunião numa disputa?","Começar pelo que concorda (há capital demais em alguns lugares); trocar a meta de giro por uma meta de retorno, que Marcos também pode defender; oferecer a ele a frente que funciona, a terceirização, como piloto. Quem vence a discussão sem dar uma vitória ao outro perde a implementação."],"ponte":["Ponte para o minicaso 2","A Vitta mostrou que o capital de uma fabricante está nas fábricas. Numa distribuidora, ele está quase todo no estoque. Se o CFO mandar cortar um quarto dele, onde vocês cortariam?","A pergunta leva a turma a responder “no estoque de segurança”, que é exatamente a armadilha da Autopar."]},{"desafios":[["E se os atacadistas pagarem só 30% do valor do obsoleto, e não metade?","O obsoleto rende R$ 9 mi de caixa (30% de R$ 30 mi) e R$ 21 mi de perda contábil (30 − 9). Com os 30 do ciclo, chega-se a 39: faltam 6 para os 45. Ou se cortam R$ 6 mi dos R$ 50 mi da reserva (12%), e a disponibilidade cai de 98% para cerca de 96,5%, ou se renegocia a meta. A discussão que importa: vale mais cumprir a meta do CFO ou a promessa às oficinas? Quem decide, e com que número?"],["A reserva supõe prazo de reposição constante. E se o navio atrasar com frequência?","A reserva calculada fica pequena demais: a variação do prazo também precisa de cobertura. A disponibilidade real já seria menor que 98%, e cortar a reserva seria ainda mais caro do que a tabela mostra. É o argumento mais forte contra a proposta de Carla."]],"atrito":["Henrique é cobrado por preço, Paula por receita, Carla pela meta de estoque. Como Luís faz Henrique aceitar entregas mensais sem sentir que perde o bônus?","Mostrar a Henrique o custo total, não só o preço: os 15 dias de ciclo a mais, que as entregas a cada dois meses criam, são R$ 30 mi parados (15 × R$ 2 mi) e custam R$ 3,6 mi por ano de capital (30 × 12%), um custo que hoje ninguém cobra dele. A saída é dividir a meta por dono da espera e medir compras pelo custo total. E o CFO precisa aceitar a perda contábil fora da meta de Paula."],"ponte":["Ponte para o minicaso 3","A Autopar liberou caixa fazendo a peça esperar menos. Há outro jeito de mover o mesmo indicador sem tocar na espera: mudar quem paga por ela. É a mesma coisa?","A turma tende a dizer que sim, porque o indicador melhora igual. O Bom Preço mostra que não é."]},{"desafios":[["Supusemos que o Laticínio São Bento repassa os 20% inteiros no preço. E se, com medo de perder a rede, ele repassar só metade?","Com metade do repasse, a rede paga R$ 9 mi por ano (metade de 90 × 20%), não 18: a Opção A vai de −7,2 para +1,8 (10,8 − 9). A decisão não se inverte (B rende +7,8), mas A deixa de destruir valor para a rede. Os outros R$ 9 mi por ano não somem: o fornecedor os absorve a 20%, e é aí que mora o risco de perdê-lo. A rede “ganha” transferindo prejuízo a quem é mais frágil na cadeia."],["E se o fornecedor fosse uma multinacional com custo de capital de 8%?","O fornecedor carrega R$ 90 mi a 8% e repassa 7,2 por ano (90 × 8%). A Opção A rende 10,8 − 7,2 = +3,6 por ano: cria valor, mas ainda menos que B (+7,8). Alongar prazo com quem tem dinheiro mais barato é legítimo; o erro é aplicar a mesma regra a todos os fornecedores."]],"atrito":["Fernanda é cobrada pelo capital de giro, e o prazo maior bate a meta dela no mês seguinte. A reposição automática leva um ano e tira dos gerentes de loja o poder de pedir. Quem perde com a Opção B, e como se lida com isso?","Os gerentes perdem autonomia e passam a ser cobrados por algo que não controlam mais; a métrica deles precisa mudar junto (ruptura medida pelo sistema, não pela intuição). Fernanda pode usar o risco sacado como ponte de curto prazo enquanto B é implantada. Sem mudar as métricas, B fracassa por resistência, não por conta."],"ponte":["Ponte para o minicaso 4","No Bom Preço, a reposição automática custa R$ 20 mi uma vez e R$ 3 mi por ano, e libera R$ 90 mi. Como comparar um custo anual com um capital liberado sem misturar as unidades?","É exatamente o problema do comitê da Embalagens Sul, e a régua é a resposta."]},{"desafios":[["E se o custo de capital da empresa fosse 8%, e não 12%?","A régua sobe para 0,66 ÷ 0,08 = 8,25. A passa a valer 6 × 8,25 − 20 = 29,5; B, 40 − 4 − 2 × 8,25 = 19,5. A decisão se inverte: com dinheiro barato, lucro recorrente vale mais e capital liberado vale menos. O empate acontece quando a régua vale 7 (6 × 7 − 20 = 40 − 4 − 2 × 7), ou seja, custo de capital de 0,66 ÷ 7 = 9,4%. A escolha entre os projetos depende do custo de capital, um número que operações raramente pergunta."],["O minicaso supõe que a liberação é permanente. E se a empresa crescer 20% ao ano?","Pela lei de Little, o estoque acompanha as vendas: o que o S&OP reduz são os dias de espera, não um valor fixo em reais. Com vendas 20% maiores, a diferença entre ter e não ter o S&OP passa de 40 para cerca de 48. O crescimento não apaga o ganho; aumenta. O que apaga é o processo deixar de funcionar."]],"atrito":["Ricardo foi treinado a vida inteira para olhar o payback. Como Patrícia leva o S&OP a ele sem parecer que está dizendo que a métrica dele está errada?","Falar a língua dele: os R$ 40 mi liberados deixam de custar 12% ao ano, ou seja, R$ 4,8 mi por ano de custo de capital evitado (40 × 12%), comparável aos R$ 6 mi de economia da máquina. Ou, pelo valor econômico anual: B dá 4,8 − 1,32 (custo anual de 2 depois do imposto) − 0,48 (12% dos 4 investidos) = 3,0; A dá 3,96 (6 depois do imposto) − 2,4 (12% dos 20 investidos) = 1,56. E oferecer a ele o que mais valoriza: uma meta verificável e uma cláusula de revisão."],"ponte":["Ponte para o minicaso 5","A régua acabou de aprovar um projeto que devolve capital ao caixa. E quando o capital entra, em vez de sair? Uma empresa que cresce 50% e bate recorde de lucro está criando valor?","A turma, com a régua fresca, já desconfia da resposta; a Vida mostra onde o capital novo foi parar."]},{"desafios":[["Se a Vida cortasse pela metade os dias de estoque do sortimento ampliado, sem perder lucro, o crescimento empataria?","Pela lei de Little, metade dos dias libera cerca de metade dos R$ 245 mi, uns R$ 122 mi. O capital novo cai para cerca de 678 (800 − 122), e o retorno sobe para 60 ÷ 678 = 8,9%, ainda abaixo de 12%. Para empatar com o lucro de hoje, o capital novo teria de ser no máximo R$ 500 mi (60 ÷ 12%): o grosso do ajuste está nas lojas (480), não no sortimento."],["Tiago diz que o lucro novo chegará a R$ 96 mi. Em que ano isso precisa acontecer para o argumento valer?","Enquanto não chega, cada ano custa a diferença entre 96 e o lucro novo daquele ano: R$ 36 mi hoje (96 − 60), menos nos anos seguintes. Uma promessa de empate sem data é uma promessa sem custo para quem a faz. A pergunta transforma o argumento de Tiago num compromisso com prazo, exatamente o que Beatriz pediu."]],"atrito":["Rogério é o CEO, o lucro é recorde e a marca é a mais lembrada da região. Como Beatriz faz a pergunta sobre o capital sem parecer que é contra crescer?","Enquadrar como crescer melhor, não como frear: aprovar em fases, pedir o retorno por safra de lojas e condicionar a fase seguinte ao número. Vale perguntar também o que mede hoje o sucesso de Tiago, lojas abertas ou retorno da safra, porque é isso que ele vai entregar."],"ponte":["Ponte para o fechamento","Cinco empresas, cinco setores. Em todas, a conta foi curta. O que decidiu cada uma?","A turma deve chegar sozinha à resposta: uma premissa de operação, convertida em valor por finanças. É a frase que fecha a sessão."]}];

const CASOS=[{"n":1,"empresa":"Vitta Cosméticos","titulo":"Vitta Cosméticos: o benchmark que veio da distribuidora","setor":"Fabricante de cosméticos · Que cadeia, quanto capital","frase":"Um CFO recém-chegado quer que uma fabricante de cosméticos gire o capital como a distribuidora de onde ele veio. A diretora de supply chain precisa responder em valor, não em adjetivos.","perguntas":["Calculem o retorno sobre o capital (margem × giro) da Vitta e da DistriMax. Por que o giro das duas é tão diferente? Marcos tem razão quando diz que a Vitta é ineficiente?","Em que atributo cada empresa é 5, e que cadeia o produto de cada uma pede, pelo critério de Fisher? O estoque de 110 dias da Vitta é desperdício ou é o custo da promessa?","Calculem o retorno com o plano completo de Marcos. Depois avaliem cada frente separadamente: qual cria valor e qual destrói? O que Renata deve recomendar, e qual estimativa de margem ela precisa testar antes?"],"secoes":[{"h":"A empresa e a promessa","paras":["A Vitta fabrica cosméticos em duas fábricas no estado do Rio de Janeiro e vende para cerca de 8 mil farmácias e perfumarias. Mantém 400 itens no catálogo e lança perto de 40 produtos por ano. O negócio gira em torno dos lançamentos: um batom ou um creme novo vende a preço cheio nas primeiras semanas, quando está na mídia e na vitrine; depois, o preço cai e o produto vira item de catálogo, vendido com desconto. Se faltar na farmácia justamente nessas semanas, a janela se perde e o cliente leva o lançamento do concorrente.","Por isso a Vitta sustenta uma promessa cara: **nenhuma farmácia fica sem produto Vitta na prateleira**. Como a demanda de um lançamento é imprevisível (ninguém sabe, antes, se o novo creme vai vender mil ou cem mil unidades), cumprir a promessa exige estoque: cerca de 110 dias do custo dos produtos, entre fábrica, centro de distribuição e trânsito. Os clientes pagam por isso. A receita é de R$ 1,1 bilhão por ano e o lucro operacional, R$ 176 milhões: uma **margem de 16%**, das mais altas do setor."],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · a promessa ao cliente","p":["Empresas que vencem costumam ser excelentes em um atributo (nota 5), boas em outro (nota 4) e medianas nos demais, entre cinco: preço, produto, acesso, serviço e experiência. A Vitta é 5 em **produto** (novidade) e 4 em **acesso** (prateleira sempre cheia). Cada atributo prende capital de um jeito: novidade e disponibilidade exigem estoque; preço baixo exige o contrário. (Notas, seção 1.4.)"]}]},{"h":"Onde está o capital da Vitta","paras":["Para funcionar, a Vitta mantém R$ 1 bilhão preso na operação. A maior parte não está no estoque: está nas duas fábricas."],"tabela":{"h":["Capital preso na operação","R$ milhões","De onde vem"],"r":[["Estoque","150","110 dias do custo dos produtos (R$ 500 mi por ano)"],["Contas a receber das farmácias","180","60 dias de prazo sobre a receita"],["Fábricas e equipamentos","670","Duas fábricas próprias"],["Total","1.000","Giro do capital: 1.100 ÷ 1.000 = 1,1"]]},"tabelaNota":null,"boxes":[{"t":"Para entender · retorno é margem vezes giro","p":["O que o acionista recebe por real preso depende de duas coisas: quanto a empresa ganha por real vendido (a **margem**: lucro ÷ receita) e quantos reais de venda cada real preso gera por ano (o **giro do capital**: receita ÷ capital). Multiplicadas, dão o **retorno sobre o capital**. Uma empresa pode chegar ao mesmo retorno com margem alta e giro baixo, ou com margem baixa e giro alto. Comparar só o giro é comparar metade de cada conta. (Notas, seções 1.2 e 1.5.)"]}]},{"h":"O benchmark","paras":["Marcos Teixeira assumiu a diretoria financeira em janeiro. Veio da DistriMax, distribuidora de produtos de higiene básicos (sabonete, pasta de dente, fralda) que atende as mesmas farmácias. A DistriMax não fabrica nada: compra pronto e revende. Seus produtos têm demanda previsível, ficam 25 dias no armazém e dão margem de 4%. Sem fábrica e com pouco estoque, o capital gira quatro vezes por ano.","Na terceira semana, Marcos mandou à diretoria um plano para levar o giro da Vitta de 1,1 para 2,0 em dois anos, “o mínimo para uma empresa eficiente”, com três frentes:"],"tabela":{"h":["Frente do plano de Marcos","Capital liberado"],"r":[["Terceirizar metade da produção e vender uma das fábricas","R$ 285 mi"],["Cortar o catálogo de 400 para 250 itens e o estoque de 110 para 55 dias","R$ 75 mi"],["Reduzir o prazo das farmácias de 60 para 30 dias","R$ 90 mi"],["Total: capital de R$ 1.000 mi para R$ 550 mi, com a mesma receita","R$ 450 mi"]]},"tabelaNota":null,"boxes":[]},{"h":"O que cada frente faz com a margem","paras":["Sérgio Prado, diretor comercial, e Lúcia Andrade, diretora industrial, responderam juntos. Não contestaram o capital liberado; contestaram o que Marcos não pôs na conta. Cada frente custa margem, por um motivo diferente:"],"tabela":{"h":["Frente","Por que a margem cai","Estimativa"],"r":[["Terceirizar metade da produção","O fabricante terceirizado cobra a própria margem, e a Vitta perde parte da velocidade de lançamento, porque passa a depender da fila de outra fábrica","−4 pontos"],["Cortar catálogo e estoque","Menos lançamentos vendidos a preço cheio; com metade do estoque, faltam produtos nas semanas de pico, e a farmácia põe o concorrente no lugar","−3 pontos"],["Encurtar o prazo das farmácias","As farmácias só aceitam pagar em 30 dias com desconto ou bonificação","−2 pontos"],["Plano completo","A margem cairia de 16% para 7%","−9 pontos"]]},"tabelaNota":"Estimativas de Sérgio e Lúcia. A receita foi mantida constante, como no plano de Marcos.","boxes":[{"t":"Para entender · o produto escolhe a cadeia","p":["Pelo critério de Fisher, produtos **funcionais** (demanda previsível, ciclo de vida longo, margem baixa, como sabonete) pedem cadeias **eficientes**, desenhadas para custo e com pouco estoque. Produtos **inovadores** (demanda imprevisível, ciclo curto, margem alta, como um lançamento de cosmético) pedem cadeias **responsivas**, que aceitam estoque e capacidade de sobra para não perder a venda. As duas cadeias prendem quantidades muito diferentes de capital, e as duas podem dar o mesmo retorno. (Notas, seção 1.3.)"]}]},{"h":"A tarefa de Renata","paras":["Renata Alves, diretora de supply chain, ficou encarregada de responder ao plano antes da reunião de diretoria. Ela concorda que há capital demais em alguns lugares. Mas desconfia de que o plano, do jeito que foi escrito, pede que a Vitta gire como uma distribuidora sem ter a margem de ninguém. E sabe que as estimativas de Sérgio e Lúcia vêm de duas áreas que têm interesse em manter tudo como está."],"tabela":null,"tabelaNota":null,"boxes":[]}],"numeros":{"h":["","Vitta (hoje)","DistriMax","Vitta com o plano de Marcos"],"r":[["Margem operacional (lucro ÷ receita)","16%","4%","7%"],["Giro do capital (receita ÷ capital)","1,1","4,0","2,0"]]},"numerosNota":"Retorno sobre o capital = margem × giro. Valores antes de impostos; como o imposto afeta todas as alternativas na mesma proporção, a comparação não muda."},{"n":2,"empresa":"Autopar","titulo":"Autopar: a meta de 25% e a única alavanca da gerente","setor":"Distribuidora de autopeças · Onde o dinheiro fica parado","frase":"O CFO manda cortar um quarto do estoque. A gerente de planejamento tem uma solução pronta, que cabe num parâmetro do sistema. O novo diretor de supply chain precisa decidir se aceita.","perguntas":["Convertam cada forma de estoque em reais. Quanto é a meta de 25%, em reais? Quem, na Autopar, decide o tamanho de cada forma?","A proposta de Carla cumpre a meta? Usando a tabela da reserva, o que ela faz com a promessa de 98% às oficinas, e quem vai perceber primeiro?","Montem uma alternativa que cumpra a meta sem tocar na reserva, com as entregas mensais e a venda do obsoleto. Quanto caixa ela libera? Que custo ela tem, e de quem Luís precisa para fazê-la acontecer?"],"secoes":[{"h":"A empresa e a promessa","paras":["A Autopar distribui peças de reposição para cerca de 6 mil oficinas mecânicas no Sudeste. O cliente da Autopar é um mecânico com um carro no elevador e um dono de carro esperando: se a peça não chega em 24 horas, a oficina compra de outro distribuidor e não volta. A promessa da empresa, repetida em toda propaganda, é **98% das peças disponíveis para entrega no dia seguinte**.","Para cumprir isso com 30 mil itens, a Autopar mantém 90 dias de estoque. O custo das peças vendidas é de R$ 730 milhões por ano, ou **R$ 2 milhões por dia**. Cada dia de estoque, portanto, é R$ 2 milhões parados no armazém: R$ 180 milhões no total."],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · estoque é tempo de espera","p":["Dado o volume que a empresa vende por dia, o estoque é o número de dias que cada peça espera na prateleira, vezes o custo de um dia de vendas. É a **lei de Little**. Só há dois jeitos de reduzir esse número de forma duradoura: vender menos ou fazer cada peça esperar menos. Uma meta de estoque que não diz qual espera vai encurtar acaba cumprida do jeito mais fácil, e mais caro: cortando a reserva. (Notas, seção 2.1.)"]}]},{"h":"A meta e a proposta","paras":["Em março, o CFO anunciou ao comitê executivo uma meta de reduzir o estoque em 25% em doze meses, “para financiar a expansão para o Sul sem tomar dívida”. A frase que acompanhou a meta foi: “a supply chain resolve”.","Luís Fernandes assumira a diretoria de supply chain duas semanas antes. Na primeira reunião com a equipe, Carla Mendes, gerente de planejamento, trouxe uma proposta pronta: reduzir à metade o parâmetro de estoque de segurança no sistema. “É a única alavanca que eu controlo. Está no sistema, dá para fazer hoje, e o estoque começa a cair no mês que vem.”"],"tabela":null,"tabelaNota":null,"boxes":[]},{"h":"Os 90 dias, um por um","paras":["Luís pediu à área de operações que separasse os 90 dias pelo motivo de cada espera. A tabela veio com uma explicação para cada linha:"],"tabela":{"h":["Forma do estoque","Dias","Por que existe","Quem decide"],"r":[["Ciclo","30","Cada fornecedor entrega a cada dois meses, em lote grande, para garantir desconto. Logo depois da entrega há 60 dias de peças na prateleira; na véspera da seguinte, quase nada. Em média, metade: 30 dias","Compras (Henrique)"],["Trânsito","20","Metade das peças vem da Ásia, de navio, em viagens de 40 dias. A Autopar é dona da mercadoria desde o embarque: 40 dias × metade = 20 dias","Compras e logística"],["Segurança","25","Reserva contra a oscilação da demanda das oficinas e o atraso dos navios, dimensionada para 98% de disponibilidade","Planejamento (Carla) e comercial"],["Obsoleto","15","Peças de carros que saíram de linha. Ninguém pede há mais de um ano","Comercial (Paula)"],["Total","90","R$ 180 milhões",""]]},"tabelaNota":null,"boxes":[{"t":"Para entender · as cinco formas do estoque","p":["“Estoque” é uma palavra para esperas diferentes: a peça que espera porque o lote de compra é grande (**ciclo**), a que está viajando (**trânsito**), a reserva contra a oscilação (**segurança**), a produzida antes de um pico (**antecipação**) e a que nunca vai vender (**obsoleto**). Cada uma nasce de uma decisão diferente, tomada por uma área diferente. É por isso que o estoque é de todos e, ao mesmo tempo, de ninguém. O estoque de ciclo médio é sempre metade do lote: entregar com o dobro da frequência corta o ciclo pela metade. (Notas, seção 2.2.)"]}]},{"h":"O que Luís ouviu","paras":["Henrique, gerente de compras, explicou que os fornecedores aceitariam entregar **todo mês**, mantendo o desconto, desde que o volume anual não mudasse. “Nunca pedi porque ninguém me cobrou estoque; me cobram preço.” Paula, do comercial, defendeu as peças fora de linha: “um dia alguém pede, e a oficina lembra de nós”. Uma consulta a dois atacadistas de ponta de estoque indicou que o obsoleto poderia ser vendido por **metade do valor** registrado no balanço; a outra metade seria lançada como perda no resultado do ano.","Sobre a proposta de Carla, o analista de planejamento lembrou a Luís como a reserva funciona: ela não protege a disponibilidade de forma proporcional. Os últimos pontos de disponibilidade são os mais caros."],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · quanto custa cada ponto de disponibilidade","p":["A reserva de segurança cresce depressa à medida que a disponibilidade prometida se aproxima de 100%. Mantidos a oscilação da demanda e o prazo dos fornecedores, a tabela abaixo mostra quanta reserva cada nível exige, tomando a reserva de hoje (98%) como 100. (Notas, seção 2.5.)",{"h":["Disponibilidade","85%","90%","95%","98%","99%"],"r":[["Reserva necessária (98% = 100)","50","62","80","100","113"]]}]}]}],"numeros":{"h":["","Valor"],"r":[["Custo das peças vendidas por dia","R$ 2 mi"],["Estoque hoje","90 dias = R$ 180 mi"],["Meta do CFO","−25% em doze meses"],["Entregas dos fornecedores","Hoje a cada 2 meses; aceitam mensal, com o mesmo desconto"],["Obsoleto","Vendido a atacadistas por metade do valor do balanço"]]},"numerosNota":null},{"n":3,"empresa":"Supermercados Bom Preço","titulo":"Bom Preço: três jeitos de liberar os mesmos R$ 90 milhões","setor":"Rede regional de supermercados · Mudar o desenho ou mudar quem paga","frase":"O Conselho quer R$ 90 milhões de capital de giro para abrir lojas sem dívida. Três propostas liberam exatamente esse valor. Para quem olha o indicador, são iguais. Para a mercadoria e para quem a financia, são opostas.","perguntas":["Classifiquem as três opções: em qual delas a mercadoria passa a esperar menos (muda o desenho)? Nas outras, quem passa a carregar a espera no lugar da rede?","Quanto a rede ganha por ano com os R$ 90 milhões liberados, a 12%? Quanto cada opção custa por ano? Qual é o resultado anual de cada uma, e em quanto tempo a Opção B paga o investimento?","Qual vocês recomendam ao Conselho? Em que situação a proposta de Fernanda deixaria de ser ruim, e por que o dono do São Bento não é essa situação?"],"secoes":[{"h":"A empresa","paras":["A Bom Preço tem 60 supermercados no interior de Minas Gerais. Compra R$ 1.095 milhões por ano de mercadorias, ou **R$ 3 milhões por dia**, e paga os fornecedores em 30 dias. Quase metade das compras vem de produtores regionais pequenos (laticínios, hortifrutigranjeiros, padarias, frigoríficos). É o que diferencia a rede das grandes: produto fresco e local.","As lojas têm 45 dias de estoque, e a razão está no processo. Cada gerente faz o próprio pedido uma vez por semana, pelo que acha que vai vender, e pede a mais por via das dúvidas, porque falta na gôndola é cobrada dele e sobra no depósito não é. Parte do que chega fica no depósito da loja, esperando espaço na gôndola. O custo de capital da rede é de 12% ao ano."],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · quem carrega a espera paga por ela","p":["Todo real preso em mercadoria é financiado por alguém, que cobra por isso ao **seu próprio** custo de capital. A rede paga 12% ao ano. Um fornecedor pequeno, que depende de crédito bancário caro, paga cerca de 20%. Um banco grande cobra da rede 11%. Empurrar uma espera para quem tem dinheiro mais caro custa mais do que economiza; empurrá-la para quem tem dinheiro mais barato pode compensar. E a melhor opção, quando possível, é não ter a espera. (Notas, seções 3.5 e 4.2.)"]}]},{"h":"As três propostas","paras":["O Conselho aprovou abrir seis lojas e pediu que R$ 90 milhões, o equivalente a 30 dias de compras, saíssem do capital de giro. Três propostas chegaram à reunião de diretoria.","**Fernanda Costa, diretora financeira:** passar a pagar os fornecedores em 60 dias, em vez de 30. “Toda rede grande faz isso. Nenhum fornecedor vai embora; eles precisam de nós mais do que nós deles.”","**João Ramos, diretor de operações:** implantar reposição automática. O sistema lê o que saiu no caixa de cada loja e repõe só isso, todo dia, a partir do centro de distribuição; o gerente de loja deixa de fazer pedido. Sem pedido semanal, sem “pedido a mais” e sem mercadoria parada no depósito, o estoque de loja cai de 45 para 15 dias, como aconteceu nas redes que adotaram o sistema. Custa R$ 20 milhões de sistema e implantação, uma vez, e R$ 3 milhões por ano de manutenção.","**Cláudio, gerente de contas do banco:** um programa de risco sacado. O banco paga os fornecedores no dia 30, como hoje, descontando juros; a rede paga o banco no dia 60. O banco cobra 11% ao ano pelos 30 dias que financia. “O fornecedor recebe no prazo de sempre.”"],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · o prazo que eu tomo é o prazo que ele espera","p":["Pagar o fornecedor mais tarde não faz a mercadoria sair mais rápido da loja; só transfere a espera para o fornecedor. Usar um banco faz o mesmo, com o banco no lugar do fornecedor. Só mudar o desenho da operação (repor mais rápido, em lotes menores) encurta a espera de verdade. As três rotas reduzem o mesmo indicador de capital de giro; só uma reduz o tamanho do cofre. (Notas, seções 3.2 a 3.4.)"]}]},{"h":"A visita ao laticínio","paras":["Antes da reunião, João visitou o Laticínio São Bento, que fornece queijo e manteiga a 40 lojas. O dono foi direto: “eu trabalho com dinheiro de banco a 20% ao ano. Se a rede me pagar em 60 em vez de 30, ou eu subo o preço na próxima tabela, ou vendo para a cooperativa”. Sobre o risco sacado, disse que conhecia: “o banco me desconta os juros na hora de pagar. Eu recebo menos, e também vou pôr isso no preço.”","João voltou com duas perguntas para a reunião. Em qual das três propostas a mercadoria passa a esperar menos? E, nas outras duas, quem passa a esperar no lugar da rede, e quanto cobra por isso?"],"tabela":null,"tabelaNota":null,"boxes":[]}],"numeros":{"h":["Opção","O que muda","Custo"],"r":[["A · Alongar o prazo (Fernanda)","Pagar os fornecedores em 60 dias, em vez de 30","Os fornecedores repassam no preço o custo de esperar 30 dias a mais, a 20% ao ano"],["B · Reposição automática (João)","A mercadoria fica 15 dias na loja, em vez de 45","R$ 20 mi uma vez e R$ 3 mi por ano"],["C · Risco sacado (Cláudio)","O banco financia 30 dias; a rede paga no dia 60","11% ao ano sobre os R$ 90 mi, que voltam no preço"]]},"numerosNota":"As três opções liberam os mesmos R$ 90 milhões (30 dias × R$ 3 milhões). Custo de capital da rede: 12% ao ano. Para simplificar, ignorem os impostos nesta conta; a conclusão não muda com eles."},{"n":4,"empresa":"Embalagens Sul","titulo":"Embalagens Sul: a máquina ou o planejamento?","setor":"Fabricante de embalagens de papelão · Quanto vale uma decisão","frase":"Dois projetos disputam o único orçamento do ano. Um corta custo todo ano. O outro devolve dinheiro ao caixa uma vez. O comitê compara os dois com uma régua que só enxerga o primeiro.","perguntas":["Usem a régua para colocar os dois projetos na mesma unidade: quanto cada um vale para o acionista?","Por que o payback não enxerga o Projeto B? O que Ricardo deveria passar a exigir dos projetos de supply chain que chegam ao comitê?","Quanto estoque o S&OP precisa liberar para empatar com a máquina? Quem pode garantir esse número, e como vocês escreveriam a aprovação de B para que ela seja cobrada?"],"secoes":[{"h":"A empresa e o seu estoque","paras":["A Embalagens Sul fabrica caixas de papelão ondulado em Santa Catarina. Três clientes da indústria de alimentos respondem por 60% da receita. Eles fazem os pedidos com dois dias de antecedência e não aceitam atraso: uma linha de envase parada por falta de caixa custa ao cliente muito mais do que a caixa. Como a fábrica leva uma semana para produzir um lote, ela não consegue esperar o pedido. Produz **para estoque**, adivinhando o que cada cliente vai pedir.","Adivinhar tem um custo. Quando a previsão erra para menos, falta caixa; para não faltar, a fábrica mantém uma reserva grande de cada modelo. Quando erra para mais, a caixa fica no armazém esperando. O resultado são R$ 70 milhões de produto acabado parado. O custo de capital da empresa é de 12% ao ano, e o imposto sobre o lucro, de 34%."],"tabela":null,"tabelaNota":null,"boxes":[]},{"h":"Os dois projetos","paras":["O comitê de investimentos, presidido pelo CFO, Ricardo Nunes, aprova um projeto por ano. Neste ano, chegaram dois.","**Projeto A · a máquina de corte**, defendido por Eduardo Lima, diretor industrial. Uma cortadeira nova reduz o refugo e a mão de obra e economiza **R$ 6 milhões por ano** de custo de produção. Investimento: **R$ 20 milhões**. Payback de 3,3 anos. “Projeto de manual: economia certa, fornecedor conhecido, risco baixo.”","**Projeto B · o planejamento integrado de vendas e operações (S&OP)**, defendido por Patrícia Souza, gerente de planejamento. A ideia é deixar de adivinhar: toda semana, fazer a previsão junto com os três grandes clientes, olhando os planos de produção deles. Com previsão melhor, a reserva de cada modelo pode ser menor, e menos caixa fica esperando. Em fábricas semelhantes, o estoque de produto acabado caiu pela metade. Aqui, isso significaria **R$ 40 milhões a menos de estoque**, de 70 para 30. Custa **R$ 4 milhões uma vez** (sistema e consultoria) e **R$ 2 milhões por ano** (uma pequena equipe dedicada)."],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · dois tipos de ganho","p":["Um projeto pode melhorar a empresa de duas maneiras. Pode **reduzir um custo que se repete todo ano**, como a máquina de Eduardo. Ou pode **devolver ao caixa dinheiro que estava preso**, como o S&OP de Patrícia: os R$ 40 milhões voltam uma vez e deixam de custar 12% ao ano para ficarem parados. As duas coisas têm valor, mas não se comparam direto, como um salário mensal e o preço de um apartamento. (Notas, seção 4.3.)"]}]},{"h":"O comitê","paras":["Ricardo abriu a reunião inclinado a aprovar A. “O B não tem payback. Não reduz custo nenhum; ao contrário, acrescenta R$ 2 milhões por ano de despesa. Como eu aprovo um projeto que piora o resultado?”","Patrícia respondeu que o B devolve R$ 40 milhões ao caixa, “que hoje custam 12% ao ano para ficar parados no armazém”. Ricardo: “mas isso é uma vez. A economia do Eduardo é todo ano, para sempre.” Os dois estavam certos, e a reunião não saiu do lugar. Ricardo pediu que alguém trouxesse os dois projetos **na mesma unidade** e respondesse a uma segunda pergunta: quanto estoque o S&OP precisa liberar, de fato, para valer a pena?"],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · a régua","p":["**R$ 1 de capital liberado vale R$ 1:** volta ao caixa uma vez. **R$ 1 de lucro a mais por ano vale cerca de R$ 5,50:** depois do imposto de 34%, sobram R$ 0,66 por ano; com dinheiro a 12%, receber R$ 0,66 por ano para sempre equivale a ter R$ 5,50 aplicados hoje (0,66 ÷ 0,12). Vale também ao contrário: um custo de R$ 1 por ano tira R$ 5,50 de valor. (Notas, seção 4.3.)","O **payback** mede o tempo que a economia anual leva para devolver o investimento. Enxerga bem um corte de custo, mas não tem onde registrar capital liberado: para ele, um projeto que devolve R$ 40 milhões ao caixa e não corta custo nenhum não vale nada."]}]}],"numeros":{"h":["","Projeto A · máquina (Eduardo)","Projeto B · S&OP (Patrícia)"],"r":[["Efeito","Custo de produção R$ 6 mi por ano menor","Estoque R$ 40 mi menor, uma vez"],["Gasto único","R$ 20 mi","R$ 4 mi"],["Custo que se repete todo ano","0","R$ 2 mi"],["Payback","3,3 anos","não existe"]]},"numerosNota":"Régua: 5,5 (imposto de 34%, custo de capital de 12%). Para simplificar, considerem os gastos únicos pelo valor cheio, sem efeito fiscal."},{"n":5,"empresa":"Farmácias Vida","titulo":"Farmácias Vida: crescer para a frente ou para trás?","setor":"Rede de farmácias · Crescer para a frente ou para trás","frase":"Em três anos a rede cresceu 50% e bateu recorde de lucro. O CEO quer repetir a dose. Uma conselheira pede que alguém mostre o que o crescimento fez com o capital antes de aprovar.","perguntas":["O que cresceu mais, em porcentagem: a receita, o lucro ou o capital? Qual das três decisões de crescimento mais prendeu capital, e por quê?","Calculem o retorno médio (lucro ÷ capital) há três anos e hoje. Ele continua acima de 12%. Rogério pode usar isso para defender o plano?","De cada R$ 100 de capital novo, quanto voltou em lucro novo por ano? Comparem com os R$ 12 de custo. O que vocês recomendam a Beatriz, e quanto lucro as lojas novas precisam gerar, quando maduras, para o crescimento empatar?"],"secoes":[{"h":"A empresa e o crescimento","paras":["A Farmácias Vida passou de 200 para 320 lojas em três anos, no Nordeste. Cresceu com três decisões de operação, todas razoáveis: **abriu 120 lojas** em cidades novas; **ampliou o sortimento** de todas as lojas, acrescentando perfumaria e conveniência, que trazem o cliente mais vezes; e **passou a vender a convênios de empresas**, com 45 dias de prazo, o que abriu um canal inteiro de clientes.","A receita subiu de R$ 2,0 bilhões para R$ 3,0 bilhões. O lucro operacional depois dos impostos subiu de R$ 240 milhões para R$ 300 milhões, o maior da história da rede. O custo de capital é de 12% ao ano."],"tabela":null,"tabelaNota":null,"boxes":[{"t":"Para entender · lucro não é valor","p":["Cada real preso em lojas, estoque e contas a receber tem um custo: na Vida, 12% ao ano, que é o que bancos e acionistas exigem. O lucro só cria valor se for maior do que esse custo sobre **todo** o capital preso. Uma empresa pode aumentar o lucro e, ao mesmo tempo, ficar mais pobre, se o capital crescer mais depressa do que o lucro que ele gera. Como o custo de capital é medido depois dos impostos, o minicaso usa o lucro depois dos impostos. (Notas, seção 5.1.)"]}]},{"h":"O plano e a pergunta","paras":["Rogério Dantas, CEO, levou ao Conselho o plano dos próximos três anos: mais 120 lojas, no mesmo modelo. “Crescemos 50%, o lucro é recorde, a marca é a mais lembrada da região. Não é hora de pisar no freio.” Tiago, diretor de expansão, apresentou a lista de cidades.","Beatriz Moreira, conselheira independente e ex-diretora financeira de uma rede de varejo, fez uma pergunta simples: “o lucro cresceu 25%. Quanto cresceu o dinheiro preso na operação para isso acontecer, e onde ele foi parar?” A diretoria financeira trouxe a resposta na reunião seguinte."],"tabela":null,"tabelaNota":null,"boxes":[]},{"h":"Onde foram parar os R$ 800 milhões","paras":["O capital preso na operação subiu de R$ 1,0 bilhão para R$ 1,8 bilhão. Cada uma das três decisões de crescimento prendeu uma parte:"],"tabela":{"h":["Decisão","Capital novo","Por que prende capital"],"r":[["120 lojas novas","R$ 480 mi","Cerca de R$ 4 mi por loja: reforma, equipamentos e o estoque inicial"],["Sortimento ampliado","R$ 245 mi","Perfumaria e conveniência giram muito mais devagar do que medicamento, e o estoque delas está em todas as 320 lojas"],["Vendas a convênios","R$ 75 mi","R$ 600 mi por ano vendidos com 45 dias de prazo: dinheiro que a Vida espera para receber"],["Total","R$ 800 mi",""]]},"tabelaNota":null,"boxes":[{"t":"Para entender · a média esconde o capital novo","p":["O retorno médio (lucro ÷ capital total) mistura o capital antigo, que já rende bem, com o capital que acabou de entrar. Para saber se o crescimento criou valor, a pergunta certa é outra: **do dinheiro que entrou, quanto voltou em lucro novo?** É o retorno do capital novo, e ele pode estar bem abaixo da média sem que a média avise. (Notas, seção 5.2.)"]}]},{"h":"O argumento de Tiago","paras":["Tiago defendeu o plano com um argumento de operação: loja nova demora para amadurecer. Leva cerca de três anos para formar clientela e chegar ao lucro de uma loja madura; as lojas abertas no último ano ainda não se pagam. “O lucro das 120 lojas ainda vai aparecer.” Beatriz respondeu que esse era justamente o número que ela queria ver escrito: quanto lucro, e em que ano."],"tabela":null,"tabelaNota":null,"boxes":[]}],"numeros":{"h":["R$ milhões","Há três anos","Hoje","Aumento"],"r":[["Receita","2.000","3.000","+1.000"],["Lucro operacional depois dos impostos","240","300","+60"],["Capital preso na operação","1.000","1.800","+800"]]},"numerosNota":"Custo de capital: 12% ao ano. O plano de Rogério repete o modelo: mais 120 lojas, mesmo sortimento, mesmos prazos aos convênios."}];

 problema:{decisao:"A Vitta deve aceitar a meta de giro 2,0 de Marcos? Se não, o que Renata recomenda no lugar?",
  jogo:"O plano de Marcos libera R$ 450 mi de capital: 285 da terceirização, 75 do corte de catálogo e estoque, 90 do prazo menor às farmácias. Pelas estimativas de Sérgio e Lúcia, ele custa 9 pontos de margem (4 + 3 + 2): de 16% para 7%. Cada ponto de margem é 1% da receita de R$ 1.100 mi, ou R$ 11 mi de lucro por ano; os 9 pontos somam R$ 99 mi por ano.",
  tutor:"Este caso parece uma discussão sobre estoque, mas não é. Antes de calcular, localizem onde está o capital da Vitta e o que o cliente dela paga para ter. A resposta certa não é “sim” nem “não” ao plano: é dizer qual parte dele cria valor."},
 pers:[["Marcos Teixeira","Diretor financeiro, veio da DistriMax","Giro 2,0 é o mínimo de uma empresa eficiente"],["Sérgio Prado","Diretor comercial","Catálogo, estoque e prazo sustentam a venda; cortar custa margem"],["Lúcia Andrade","Diretora industrial","Terceirizar custa 4 pontos e tira velocidade de lançamento"],["Renata Alves","Diretora de supply chain","Precisa responder ao plano; desconfia dele e das estimativas"]],
 tutor:[
  {d1:"Retorno = margem × giro. As duas medidas de cada empresa estão no quadro Os números.",d2:"Vitta: 16% × 1,1. DistriMax: 4% × 4,0. Agora olhem a tabela do capital: dos R$ 1.000 mi, quanto está nas fábricas?",r:"A Vitta rende 17,6% (16% × 1,1) e a DistriMax, 16,0% (4% × 4,0): girando a um quarto da velocidade (1,1 contra 4,0), a Vitta rende mais. O giro baixo vem das fábricas: R$ 670 mi dos R$ 1.000 mi de capital (67%), um ativo que uma distribuidora não tem. Comparar o giro de uma fabricante com o de uma distribuidora é comparar modelos de negócio, não eficiência. Marcos olhou metade da conta.",e:"Por que uma fabricante gira mais devagar do que uma distribuidora, mesmo com o mesmo estoque?"},
  {d1:"Perguntem o que o cliente da Vitta paga para ter. E o da DistriMax?",d2:"A demanda de um lançamento é previsível? Se não é, e a janela de venda é curta, o que a cadeia precisa ter de sobra?",r:"A Vitta é 5 em produto (40 lançamentos por ano) e 4 em acesso (prateleira cheia): produto inovador, cadeia responsiva, que aceita estoque para não perder a janela. A DistriMax é 5 em preço, com produto funcional e cadeia eficiente. Os 110 dias são o custo da promessa e somam R$ 150 mi, só 15% dos R$ 1.000 mi de capital. Pode haver estoque sem função dentro deles; a resposta é procurá-lo, não cortar pela metade.",e:"Por que 110 dias de estoque podem estar certos para a Vitta e errados para a DistriMax?"},
  {d1:"Plano completo: o capital cai de 1.000 para 550 e a margem, de 16% para 7%. Calculem o novo giro e multipliquem.",d2:"Agora uma frente de cada vez: capital = 1.000 menos o que a frente libera; margem = 16% menos o custo da frente. Comparem cada retorno com 17,6%.",r:"Plano completo: capital de 550 (1.000 − 450), giro de 2,0 (1.100 ÷ 550), margem de 7% (16 − 9): retorno de 14,0%, abaixo dos 17,6% de hoje. Destrói valor. Frente a frente, com capital = 1.000 menos o que a frente libera e margem = 16% menos o custo da frente: terceirizar dá giro de 1,54 (1.100 ÷ 715) × 12% = 18,5% (cria); catálogo dá 1,19 (1.100 ÷ 925) × 13% = 15,5% (destrói); prazo dá 1,21 (1.100 ÷ 910) × 14% = 16,9% (destrói). A terceirização empata se a margem cair até 11,4% (17,6% ÷ 1,54), isto é, se custar até 4,6 pontos; Lúcia estima 4. É essa estimativa que Renata precisa testar, com cotações de terceiros e um piloto.",e:"Por que a frente que muda como a Vitta produz cria valor, e as que mudam o que o cliente recebe destroem?"}],
 opcoes:[["Aceitar o plano completo","Terceiriza, corta catálogo e estoque, encurta o prazo","Capital −R$ 450 mi (285 + 75 + 90); margem de 16% para 7% (−4 −3 −2); retorno de 2,0 × 7% = 14,0%, contra 17,6% hoje","A promessa (produto 5, acesso 4) deixa de ser cumprida","Marcos cumpre a meta; comercial e farmácias perdem"],
  ["Recusar o plano inteiro","Nada muda","Retorno segue em 17,6% (16% × 1,1)","Capital sem função continua parado","Ninguém perde agora; a discussão volta no ano seguinte"],
  ["Terceirizar metade, em piloto","Itens maduros vão para terceiro; uma fábrica é vendida","Capital de 715 (1.000 − 285); margem de 12% (16 − 4, pela estimativa de Lúcia); retorno de 1,54 × 12% = 18,5%","A estimativa de 4 pontos estar errada; atrasar lançamentos","Lúcia perde uma fábrica; Marcos ganha parte da meta"]],
 conc:[
  ["Na operação: margem vem de preço e custo; giro vem de quanto capital a operação exige (fábricas, estoque, prazo).","Em finanças: é o ROCE decomposto (DuPont). Retorno acima do custo de capital cria valor.","Erro comum: perseguir uma das duas medidas isoladamente.","Para pensar: na sua empresa, qual das duas o Conselho cobra? E qual a operação controla?"],
  ["Na operação: ter fábrica é escolher controle de qualidade, velocidade e segredo de fórmula.","Em finanças: ativo fixo pesa no denominador; o giro cai mesmo com estoque enxuto.","Erro comum: usar o benchmark de giro de outro modelo de negócio.","Para pensar: qual benchmark de giro a sua empresa usa, e de que tipo de empresa ele vem?"],
  ["Na operação: cadeia eficiente minimiza custo; cadeia responsiva compra velocidade e folga.","Em finanças: a responsiva prende mais capital e precisa de margem maior para render o mesmo.","Erro comum: aplicar a mesma meta de estoque a produtos funcionais e inovadores.","Para pensar: os seus produtos são todos do mesmo tipo? A cadeia trata todos igual?"],
  ["Na operação: cada atributo da promessa pede um ativo: novidade e disponibilidade pedem estoque.","Em finanças: cortar capital que sustenta o 5 ou o 4 custa margem, e a conta precisa mostrar quanto.","Erro comum: cortar o capital que sustenta a promessa para melhorar um indicador.","Para pensar: em que atributo a sua empresa é 5? Que capital sustenta esse 5?"]]},
autopar:{
 problema:{decisao:"Aceitar a proposta de Carla de cortar a reserva pela metade? Se não, de onde saem os R$ 45 mi?",
  jogo:"A meta é 25% do estoque: o estoque é de 90 dias, e cada dia vale R$ 2 mi (R$ 730 mi de custo das peças por ano ÷ 365), ou R$ 180 mi; 25% disso são R$ 45 mi para a expansão ao Sul, sem dívida. Do outro lado está a promessa de 98% das peças disponíveis às 6 mil oficinas, que é o que faz a oficina voltar.",
  tutor:"A meta é de 25% do estoque, mas “estoque” não é uma coisa só: são quatro esperas, cada uma com um dono. Antes de aceitar ou recusar Carla, descubram de quem é cada espera. A solução está nas esperas que não têm função."},
 pers:[["O CFO","Diretor financeiro","Meta de −25% de estoque: “a supply chain resolve”"],["Luís Fernandes","Diretor de supply chain há duas semanas","Precisa decidir o que propor"],["Carla Mendes","Gerente de planejamento","Cortar a reserva pela metade: “a única alavanca que eu controlo”"],["Henrique","Gerente de compras","Fornecedores aceitam entrega mensal: “me cobram preço”"],["Paula","Comercial","Não quer liquidar peças fora de linha"]],
 tutor:[
  {d1:"Cada dia de estoque custa R$ 2 mi (R$ 730 mi de custo das peças por ano ÷ 365 dias). Multipliquem os dias de cada linha por 2.",d2:"Para o dono, perguntem que decisão cria cada espera: o lote, a viagem, a promessa de 98%, o portfólio.",r:"Ciclo 30 dias × 2 = R$ 60 mi; trânsito 20 × 2 = 40; segurança 25 × 2 = 50; obsoleto 15 × 2 = 30. Total: 90 dias, R$ 180 mi. A meta de 25% é 0,25 × 180 = R$ 45 mi. Só a segurança está nas mãos de Carla; o ciclo é de Henrique, o trânsito de compras e logística, o obsoleto de Paula. A meta foi dada à supply chain, mas três das quatro alavancas estão em outras áreas. Por isso a proposta cai no único parâmetro que alguém controla sozinho.",e:"Por que uma meta sobre o estoque total tende a ser cumprida cortando a reserva?"},
  {d1:"Metade da reserva de 25 dias são quantos dias? Em reais?",d2:"Na tabela da reserva, 50 de reserva corresponde a que disponibilidade?",r:"Cortar metade da reserva de 25 dias libera 12,5 dias × R$ 2 mi = R$ 25 mi: não cumpre os 45. E, pela tabela da reserva do caso, 50 de reserva (metade dos 100 de hoje) sustenta cerca de 85% de disponibilidade, não 98%: falta peça em 15% das reposições, cerca de uma em cada sete. Quem percebe primeiro é o mecânico com o carro no elevador; depois o comercial, quando as oficinas mudam de distribuidor. A proposta não cumpre a meta e derruba a promessa.",e:"Por que cortar metade da reserva não tira só metade da disponibilidade?"},
  {d1:"Com entrega mensal, o lote passa de 60 para 30 dias. O ciclo médio é metade do lote.",d2:"O obsoleto vale R$ 30 mi no balanço, mas o atacadista paga metade. O que é caixa e o que é perda?",r:"Com entrega mensal, o lote cai de 60 para 30 dias e o ciclo médio, de 30 para 15 dias: 15 dias × R$ 2 mi = R$ 30 mi. O obsoleto vale R$ 30 mi no balanço (15 dias × R$ 2 mi); vendido por metade, dá R$ 15 mi de caixa e R$ 15 mi de perda contábil. Caixa total: 30 + 15 = R$ 45 mi, a meta exata, com a reserva intacta. O custo é a perda no resultado, que já tinha acontecido quando as peças deixaram de vender. Luís precisa de Henrique (fornecedores), de Paula (liquidar) e do CFO (aceitar a perda no trimestre).",e:"Por que a perda contábil do obsoleto não é um custo novo criado pela decisão?"}],
 opcoes:[["Proposta de Carla: cortar 50% da reserva","Reserva de 25 para 12,5 dias","12,5 dias × R$ 2 mi = R$ 25 mi de caixa: não cumpre os R$ 45 mi","Pela tabela da reserva, disponibilidade de 98% para cerca de 85%","Carla entrega parte da meta; oficinas e comercial perdem"],
  ["Entregas mensais e venda do obsoleto","Ciclo de 30 para 15 dias; o obsoleto sai","Caixa: 30 do ciclo (15 dias × R$ 2 mi) + 15 do obsoleto (metade de R$ 30 mi) = R$ 45 mi; R$ 15 mi de perda contábil","Fornecedor cobrar pelo lote menor; recuperação abaixo de 50%","Henrique muda de critério; Paula perde as peças; o CFO assume a perda"],
  ["Encurtar o trânsito com frete aéreo","Menos dias de viagem","Libera caixa, mas o frete aéreo custa muito mais todo ano","Custo recorrente maior que o ganho","Logística ganha; o resultado perde"]],
 conc:[
  ["Na operação: estoque é fila; para reduzir, encurte a espera ou reduza o fluxo.","Em finanças: dias de estoque × custo diário = capital preso, que custa o WACC por ano.","Erro comum: fixar meta de estoque sem dizer qual espera vai encurtar.","Para pensar: a última meta de estoque da sua empresa disse qual espera mudaria?"],
  ["Na operação: ciclo, trânsito, segurança, antecipação e obsoleto têm causas diferentes.","Em finanças: o balanço mostra um número só; a decisão precisa das cinco partes.","Erro comum: tratar o estoque como responsabilidade de uma área só.","Para pensar: quem é o dono de cada forma de estoque na sua empresa?"],
  ["Na operação: entregar com o dobro da frequência corta o ciclo médio pela metade.","Em finanças: libera capital sem tocar na reserva; o custo é o frete e o pedido extras.","Erro comum: achar que o ciclo é o lote inteiro.","Para pensar: os seus fornecedores entregariam mais vezes, se alguém pedisse?"],
  ["Na operação: os últimos pontos de disponibilidade são os mais caros em reserva.","Em finanças: cortar reserva libera pouco e custa receita, que não aparece no balanço.","Erro comum: supor que a reserva protege a disponibilidade em linha reta.","Para pensar: quanto vale, em receita, cada ponto de disponibilidade para o seu cliente?"],
  ["Na operação: o obsoleto ocupa espaço e atenção, e não vende.","Em finanças: vender por menos que o balanço gera caixa e reconhece uma perda que já existia.","Erro comum: adiar a venda para não mostrar a perda.","Para pensar: há obsoleto no seu balanço avaliado por um valor que ninguém pagaria?"]]},
bompreco:{
 problema:{decisao:"Qual das três propostas levar ao Conselho: alongar o prazo, reposição automática ou risco sacado?",
  jogo:"O Conselho pediu R$ 90 mi para abrir seis lojas: 30 dias de compras, a R$ 3 mi por dia (R$ 1.095 mi por ano ÷ 365). As três propostas liberam os mesmos R$ 90 mi; o indicador de capital de giro não distingue entre elas, o resultado anual sim.",
  tutor:"Três propostas, o mesmo capital liberado. A pergunta que separa uma da outra é simples: a mercadoria passa a esperar menos, ou alguém continua esperando no lugar da rede? E quem espera cobra pela espera, ao custo do próprio dinheiro."},
 pers:[["Fernanda Costa","Diretora financeira","Pagar em 60 dias: “nenhum fornecedor vai embora”"],["João Ramos","Diretor de operações","Reposição automática: estoque de 45 para 15 dias"],["Cláudio","Gerente de contas do banco","Risco sacado: o banco financia a 11%"],["Dono do Laticínio São Bento","Fornecedor regional","Dinheiro a 20%: sobe o preço ou vende à cooperativa"]],
 tutor:[
  {d1:"Para cada proposta: a mercadoria fica menos tempo na loja?",d2:"Se não fica, alguém continua carregando a espera. Quem: o fornecedor ou o banco?",r:"Só a reposição automática muda o desenho: a mercadoria passa de 45 para 15 dias na loja. Alongar o prazo transfere 30 dias de espera ao fornecedor; o risco sacado transfere ao banco. As três liberam R$ 90 mi; só uma reduz a fila.",e:"Por que o mesmo capital liberado pode esconder decisões de natureza oposta?"},
  {d1:"Ganho de todas: R$ 90 mi × 12% por ano. Custo de A: R$ 90 mi × 20%. Custo de C: R$ 90 mi × 11%.",d2:"B custa R$ 3 mi por ano e R$ 20 mi uma vez. Payback = investimento ÷ resultado anual.",r:"Os R$ 90 mi liberados deixam de custar 12% à rede: 90 × 12% = R$ 10,8 mi por ano, em todas. A: o fornecedor carrega os R$ 90 mi a 20% e repassa 90 × 20% = 18 no preço: 10,8 − 18 = −7,2. B: 10,8 − 3 de manutenção = +7,8; payback de 20 ÷ 7,8 = 2,6 anos. C: o banco cobra 90 × 11% = 9,9: 10,8 − 9,9 = +0,9. A destrói valor porque empurra a espera para quem tem dinheiro mais caro; C quase empata porque o banco é só um pouco mais barato que a rede.",e:"Por que alongar o prazo destrói valor mesmo que o fornecedor não reclame?"},
  {d1:"Em que custo de capital do fornecedor a Opção A dá zero?",d2:"Comparem com os 20% do São Bento. E lembrem o que diferencia a rede das grandes.",r:"O resultado de A é 90 × (12% − custo de capital do fornecedor): dá zero quando o fornecedor tem o mesmo custo de capital da rede, 12%. Um fornecedor multinacional a 8% carregaria a espera mais barato. O São Bento, a 20%, não: sobe o preço ou vai para a cooperativa, e a rede perde o produto fresco e local que a diferencia. Recomendação: B; se o caixa for urgente, C como ponte enquanto B é implantada.",e:"Em uma frase: quando alongar o prazo com o fornecedor é uma boa decisão?"}],
 opcoes:[["A · Alongar o prazo para 60 dias","Ninguém muda a operação; o fornecedor espera 30 dias a mais","R$ 90 mi de caixa; 10,8 de ganho (90 × 12%) − 18 de repasse (90 × 20%) = −R$ 7,2 mi por ano","Fornecedor pequeno sobe o preço ou sai","Fernanda cumpre a meta rápido; os fornecedores pequenos pagam"],
  ["B · Reposição automática","A mercadoria fica 15 dias na loja, não 45","R$ 90 mi de caixa; 10,8 − 3 de manutenção = +R$ 7,8 mi por ano; R$ 20 mi uma vez (payback de 2,6 anos)","Implantação de um ano; resistência dos gerentes","Gerentes perdem o pedido; a rede ganha a fila mais curta"],
  ["C · Risco sacado","O banco financia 30 dias no lugar da rede","R$ 90 mi de caixa; 10,8 − 9,9 de juros (90 × 11%) = +R$ 0,9 mi por ano","É dívida com outro nome; depende do banco","O banco ganha a taxa; o fornecedor recebe no prazo de sempre"]],
 conc:[
  ["Na operação: quem espera pela mercadoria ou pelo pagamento está financiando a cadeia.","Em finanças: cada um cobra ao próprio custo de capital, embutido no preço ou na taxa.","Erro comum: achar que o prazo do fornecedor é dinheiro grátis.","Para pensar: qual o custo de capital dos seus menores fornecedores?"],
  ["Na operação: pagar mais tarde não muda o tempo que a mercadoria fica na loja.","Em finanças: o DPO de um é o DSO do outro; a cadeia não ficou mais curta.","Erro comum: celebrar a queda do ciclo de caixa sem olhar a fila da cadeia.","Para pensar: a última melhora do seu ciclo de caixa veio de desenho ou de prazo?"],
  ["Na operação: desenho muda a espera; financiamento muda quem a paga.","Em finanças: desenho libera capital de vez; financiamento cobra todo ano.","Erro comum: comparar opções só pelo capital liberado.","Para pensar: quais metas de capital de giro da sua empresa distinguem as duas rotas?"]]},
embalagens:{
 problema:{decisao:"Qual projeto o comitê aprova, a máquina ou o S&OP, e com que condição?",
  jogo:"Um orçamento, dois projetos. A máquina corta R$ 6 mi por ano de custo e exige R$ 20 mi uma vez. O S&OP devolve ao caixa R$ 40 mi de estoque (de 70 para 30), com R$ 4 mi uma vez e R$ 2 mi por ano de custo.",
  tutor:"Os dois diretores estão certos, e a reunião não sai do lugar porque falam em unidades diferentes: um fala em dinheiro por ano, a outra em dinheiro de uma vez. O trabalho do grupo é pôr os dois na mesma unidade e encontrar o número que decide."},
 pers:[["Ricardo Nunes","CFO, preside o comitê","“O B não tem payback; piora o resultado”"],["Eduardo Lima","Diretor industrial","Máquina de corte: R$ 6 mi por ano de economia"],["Patrícia Souza","Gerente de planejamento","S&OP com os três clientes: R$ 40 mi a menos de estoque"],["Os três clientes","60% da receita","Pedem com dois dias de antecedência e não aceitam atraso"]],
 tutor:[
  {d1:"Régua: R$ 1 de lucro por ano, depois de 34% de imposto, vira R$ 0,66; com dinheiro a 12%, receber 0,66 por ano para sempre vale 0,66 ÷ 0,12 ≈ 5,5 hoje. R$ 1 de capital liberado vale 1, porque volta uma vez.",d2:"A: 6 × 5,5 − 20. B: 40 − 4 − 2 × 5,5.",r:"A: 6 por ano × 5,5 = 33, menos os 20 investidos = 13. B: 40 de estoque liberado (vale 40), menos 4 de gasto único, menos 2 por ano × 5,5 = 11: 40 − 4 − 11 = 25. B vale quase o dobro, com um quinto do investimento. Ricardo e Patrícia estavam certos ao mesmo tempo: faltava a unidade comum.",e:"Por que R$ 1 de economia anual vale cerca de cinco vezes R$ 1 de estoque liberado?"},
  {d1:"O payback divide o investimento pela economia anual. Qual é a economia anual de B?",d2:"Onde aparece o ganho de B: no resultado ou no balanço?",r:"B não economiza custo; acrescenta R$ 2 mi por ano. O ganho está no balanço: R$ 40 mi que voltam ao caixa e deixam de custar 12% ao ano. O payback não tem onde registrar isso. Ricardo deveria exigir de todo projeto dois números, o efeito no custo anual e no capital, convertidos na mesma régua.",e:"O que o payback mede bem, e o que ele não enxerga?"},
  {d1:"B empata com A quando liberação − 4 − 11 = 13.",d2:"Quem tem os dados para garantir a liberação? E como tornar a promessa verificável?",r:"Liberação de empate: liberação − 4 − 11 = 13 (o valor de A), logo liberação = R$ 28 mi. Abaixo disso, a máquina vale mais. Quem garante é Patrícia, com os três clientes. Aprovação bem escrita: “liberar R$ 40 mi aceitando até R$ 2 mi por ano de custo; se em doze meses não tiver liberado R$ 28 mi, o comitê revê o projeto”.",e:"Por que a aprovação precisa trazer o número de empate escrito?"}],
 opcoes:[["A · Máquina de corte","Menos refugo e mão de obra","R$ 6 mi por ano a menos de custo: 6 × 5,5 − 20 de investimento = vale 13","Economia menor que a prevista","Eduardo ganha; o estoque segue em R$ 70 mi"],
  ["B · S&OP, com meta e revisão","Previsão semanal com os clientes; reserva menor","R$ 40 mi de estoque a menos: 40 − 4 − 2 × 5,5 = vale 25","Liberar menos de R$ 28 mi; a disciplina não durar","Patrícia assume a meta; o comercial divide a previsão"],
  ["B · S&OP, sem meta escrita","O mesmo processo, sem compromisso","O mesmo valor, se acontecer","Ninguém cobra se o estoque voltar","O comitê perde a forma de verificar"]],
 conc:[
  ["Na operação: um projeto pode cortar custo ou soltar capital; os dois melhoram a empresa.","Em finanças: um é fluxo (todo ano), o outro é estoque (uma vez).","Erro comum: comparar R$ por ano com R$ de uma vez.","Para pensar: os projetos de supply chain da sua empresa chegam com os dois números?"],
  ["Na operação: dá uma unidade única para comparar qualquer projeto de cadeia.","Em finanças: é a perpetuidade depois do imposto, (1 − t) ÷ WACC; a lógica do EVA.","Erro comum: multiplicar também o capital liberado por 5,5.","Para pensar: qual é a régua da sua empresa, com o imposto e o custo de capital dela?"],
  ["Na operação: o payback é simples e mede o risco de prazo.","Em finanças: ignora o balanço; não registra capital liberado nem o valor depois do payback.","Erro comum: concluir que o payback é inútil.","Para pensar: que projeto bom a sua empresa já recusou por não ter payback?"]]},
vida:{
 problema:{decisao:"O Conselho deve aprovar mais 120 lojas no mesmo modelo?",
  jogo:"O capital preso subiu R$ 800 mi em três anos (de 1.000 para 1.800). O lucro depois dos impostos subiu R$ 60 mi por ano (de 240 para 300). A 12% ao ano, os R$ 800 mi novos custam 800 × 12% = R$ 96 mi por ano: mais do que os 60 que trouxeram.",
  tutor:"O lucro recorde é verdade, e o retorno médio confortável também. A pergunta de Beatriz desloca o olhar para outro lugar: o dinheiro que entrou, quanto rendeu? Sigam o capital novo, decisão por decisão."},
 pers:[["Rogério Dantas","CEO","Mais 120 lojas: “não é hora de pisar no freio”"],["Tiago","Diretor de expansão","Loja nova leva três anos para amadurecer"],["Beatriz Moreira","Conselheira independente","“Quanto cresceu o dinheiro preso, e onde foi parar?”"]],
 tutor:[
  {d1:"Variação percentual = hoje ÷ antes − 1, para receita, lucro e capital.",d2:"Na tabela “Onde foram parar”, qual linha é maior, e por que ela prende capital antes de vender?",r:"Receita +50% (3.000 ÷ 2.000 − 1), lucro +25% (300 ÷ 240 − 1), capital +80% (1.800 ÷ 1.000 − 1). As lojas novas prenderam R$ 480 mi dos 800 novos (60%), cerca de R$ 4 mi por loja × 120 lojas: reforma, equipamentos e estoque inicial antes da primeira venda. O sortimento vem em segundo (R$ 245 mi): perfumaria gira devagar e está nas 320 lojas.",e:"Por que o capital pode crescer mais depressa do que a receita?"},
  {d1:"Lucro ÷ capital, há três anos e hoje.",d2:"16,7% está acima de 12%. Isso diz algo sobre o capital que acabou de entrar?",r:"24% há três anos (240 ÷ 1.000), 16,7% hoje (300 ÷ 1.800). A média prova que a rede, no total, ainda cria valor; não prova que o crescimento criou, porque mistura as lojas antigas, muito rentáveis, com o capital novo. Rogério pode defender a rede com a média, não o plano.",e:"Por que a média esconde o problema?"},
  {d1:"Retorno do capital novo = lucro novo ÷ capital novo = 60 ÷ 800.",d2:"Para empatar, o lucro novo precisa ser 12% de 800.",r:"Retorno do capital novo: 60 ÷ 800 = 7,5%, contra 12% de custo. Valor perdido por ano: 800 × (12% − 7,5%) = R$ 36 mi. Para empatar, o lucro novo precisa chegar a 12% × 800 = R$ 96 mi. Recomendação: não aprovar 120 lojas no mesmo modelo; crescer em fases, com menos capital por loja e a curva de maturação de Tiago escrita, por safra de lojas.",e:"Qual número Tiago precisa mostrar, e por que ele precisa vir com um ano?"}],
 opcoes:[["Aprovar 120 lojas no mesmo modelo","Repetir o que foi feito","Mais capital rendendo, por enquanto, 7,5% (60 ÷ 800), contra 12% de custo","Ampliar a perda de R$ 36 mi por ano (800 × 4,5 pontos)","Rogério e Tiago ganham; o acionista paga"],
  ["Parar de crescer","Nenhuma loja nova","Para a perda no capital novo","Perder mercado para quem crescer","O Conselho se protege; a marca perde espaço"],
  ["Crescer em fases, com menos capital por loja","Sortimento e estoque inicial por perfil de cidade; curva de maturação por safra","Menos capital por real de venda nova","A maturação não chegar a R$ 96 mi","Tiago assume um número com prazo; Beatriz ganha o controle"]],
 conc:[
  ["Na operação: cada loja, cada item e cada dia de prazo prendem capital.","Em finanças: EVA = lucro depois do imposto − WACC × capital.","Erro comum: celebrar lucro recorde sem olhar o capital que ele exigiu.","Para pensar: o lucro da sua empresa cresceu mais ou menos que o capital, nos últimos três anos?"],
  ["Na operação: lojas antigas maduras escondem as novas no total.","Em finanças: retorno incremental = Δ lucro ÷ Δ capital; compare com o WACC.","Erro comum: aprovar crescimento pelo retorno médio.","Para pensar: qual foi o retorno do último real investido na sua área?"],
  ["Na operação: o que sobra depois de remunerar quem financia a operação.","Em finanças: lucro econômico; positivo cria valor, negativo destrói, mesmo com lucro contábil.","Erro comum: confundir lucro contábil com criação de valor.","Para pensar: o seu bônus é medido por lucro ou por valor econômico?"]]}
};

 contra:{p:'Marcos: “se terceirizar metade cria valor, terceirizar tudo cria o dobro; e giro 2,0 é o que os analistas cobram.” A melhor resposta:',o:[
  ['Concordar: se metade cria valor, tudo cria mais',0,'O custo de margem não cresce em linha reta. A primeira metade são itens maduros; a segunda são lançamentos, onde atraso custa o 5 da promessa.'],
  ['O custo não é linear: a segunda metade são lançamentos, o 5 da promessa. E o acionista recebe retorno, não giro: com o plano completo, 14% contra 17,6%',1,'Concorda com o que é verdade (a primeira metade cria valor), traz o mecanismo e termina num número.'],
  ['Recusar: terceirizar é sempre perder controle',0,'É um adjetivo, não um número. Marcos responde com outro adjetivo e a reunião vira disputa.']]}},
autopar:{q:[
 {p:'A meta de 25% está nas mãos de quem?',o:[
  ['Da supply chain, como disse o CFO',0,'“Supply chain” não decide o lote (compras), a viagem (logística) nem o portfólio (comercial). Três das quatro esperas estão em outras áreas.'],
  ['De Carla: ela controla o estoque de segurança',0,'Carla controla 25 dos 90 dias. É por isso que a proposta dela cai no único parâmetro que alguém controla sozinho.'],
  ['De quatro áreas: compras (ciclo, 60), logística (trânsito, 40), planejamento e comercial (segurança, 50), comercial (obsoleto, 30)',1,'R$ 180 mi em quatro esperas com quatro donos. A meta de R$ 45 mi (25% × 180) só sai de uma área se for cortando a reserva.']]},
 {p:'A proposta de Carla (cortar a reserva pela metade)…',o:[
  ['Cumpre a meta e é a mais rápida',0,'Metade de 25 dias são 12,5 dias × R$ 2 mi = R$ 25 mi. A meta é 45.'],
  ['Não cumpre a meta (R$ 25 mi) e derruba a disponibilidade de 98% para cerca de 85%',1,'Pela tabela da reserva, 50 de reserva sustenta cerca de 85%: falta peça em uma de cada sete reposições. Quem percebe primeiro é o mecânico com o carro no elevador.'],
  ['Cumpre a meta, mas custa um pouco de serviço',0,'Nem cumpre (25 < 45), nem é pouco: os últimos pontos de disponibilidade são os mais caros em reserva, e cortar metade tira 13 pontos.']]},
 {p:'A alternativa com entregas mensais e venda do obsoleto…',o:[
  ['Libera R$ 60 mi de caixa (30 do ciclo + 30 do obsoleto)',0,'O obsoleto vale R$ 30 mi no balanço, mas o atacadista paga metade: R$ 15 mi de caixa e R$ 15 mi de perda contábil.'],
  ['Libera R$ 45 mi de caixa (30 + 15), com R$ 15 mi de perda contábil, e exige Henrique, Paula e o CFO',1,'Entrega mensal corta o ciclo médio de 30 para 15 dias (15 × 2 = 30). A perda do obsoleto já tinha acontecido; a venda só a reconhece. Luís precisa de três áreas que não são dele.'],
  ['Libera R$ 30 mi; o obsoleto não deve ser vendido porque gera perda',0,'A perda já existe: as peças não valem o que o balanço diz. Vender transforma R$ 15 mi em caixa; manter deixa R$ 30 mi parados que não valem isso.']]}],
 contra:{p:'O CFO: “vender o obsoleto põe R$ 15 mi de perda no trimestre, e o mercado vai ver; cortar a reserva não aparece em lugar nenhum.” A melhor resposta:',o:[
  ['Adiar a venda do obsoleto para não mostrar a perda',0,'A perda já aconteceu quando as peças deixaram de vender. Adiar só mantém R$ 30 mi parados no balanço valendo 15.'],
  ['A perda já aconteceu; vender só a reconhece e traz R$ 15 mi de caixa. Cortar a reserva também custa, mas na receita: falta peça em uma de cada sete reposições',1,'Separa caixa de resultado e mostra onde aparece cada custo: o do obsoleto no balanço, o da reserva na receita do trimestre seguinte.'],
  ['Cortar a reserva, como o CFO prefere, e deixar o obsoleto',0,'Libera 25, não 45, e derruba a disponibilidade para 85%. O custo existe; só não aparece no balanço.']]}},
bompreco:{q:[
 {p:'Em qual proposta a mercadoria passa a esperar menos na loja?',o:[
  ['Nas três: todas liberam R$ 90 mi',0,'Liberam o mesmo capital, mas por caminhos opostos. Em A e C a mercadoria fica os mesmos 45 dias; só muda quem financia a espera.'],
  ['Só na reposição automática (B): de 45 para 15 dias. A e C mudam quem paga a espera: o fornecedor e o banco',1,'O indicador de capital de giro melhora igual nas três. Só B reduz o tamanho da fila; as outras a transferem.'],
  ['Em A e C: são as mais rápidas de implantar',0,'Rapidez não é espera. Em A o fornecedor espera 30 dias a mais; em C, o banco. A mercadoria continua 45 dias na loja.']]},
 {p:'Quanto cada opção rende por ano (R$ mi)?',o:[
  ['A é a melhor: não tem custo nenhum',0,'O fornecedor carrega R$ 90 mi a 20% e repassa R$ 18 mi por ano no preço. Ganho de 10,8 (90 × 12%) menos 18 = −7,2.'],
  ['B: +7,8 (10,8 − 3), payback de 2,6 anos (20 ÷ 7,8). A: −7,2. C: +0,9 (10,8 − 9,9)',1,'As três ganham 10,8 (90 × 12%). O que as separa é quanto custa quem carrega a espera: 20% do fornecedor, 11% do banco, ou R$ 3 mi por ano de manutenção.'],
  ['C é a melhor: o banco é mais barato que o fornecedor',0,'Mais barato que o fornecedor (11% contra 20%), mas quase igual à rede (12%): sobra 0,9 por ano. E a fila continua do mesmo tamanho.']]},
 {p:'Quando alongar o prazo com o fornecedor cria valor?',o:[
  ['Nunca: é sempre empurrar o problema para o outro',0,'Depende de quem é o outro. Uma multinacional a 8% carrega a espera mais barato do que a rede a 12%: a cadeia inteira paga menos.'],
  ['Quando o fornecedor tem custo de capital menor que o da rede (12%). O São Bento, a 20%, não: sobe o preço ou vai para a cooperativa',1,'Resultado de A = 90 × (12% − custo do fornecedor). Positivo abaixo de 12%, negativo acima. A mesma medida muda de sinal conforme quem a recebe.'],
  ['Sempre que o fornecedor aceitar',0,'O São Bento aceita e repassa na próxima tabela, ou vende para a cooperativa. Aceitar não é absorver.']]}],
 contra:{p:'Fernanda: “os fornecedores aceitaram os 60 dias. Se ninguém reclamou, de onde vem esse custo de 20%?” A melhor resposta:',o:[
  ['Eles não reclamam: repassam. R$ 90 mi a 20% são R$ 18 mi por ano na próxima tabela de preço, ou o fornecedor vai vender para quem paga em 30',1,'Troca R$ 10,8 mi de ganho por R$ 18 mi de custo e arrisca o sortimento local que diferencia a rede.'],
  ['Se ninguém reclamou, o custo é zero',0,'Fornecedor pequeno não reclama com o maior cliente; embute no preço. O custo aparece com um ano de atraso, na tabela.'],
  ['Pedir desconto em troca do prazo maior',0,'Desconto é o repasse ao contrário: o fornecedor a 20% só dá desconto se tirar de outro lugar. O custo da espera continua existindo.']]}},
embalagens:{q:[
 {p:'Na régua, quanto vale cada projeto para o acionista?',o:[
  ['A vale 13 (6 × 5,5 − 20) e B vale 25 (40 − 4 − 2 × 5,5)',1,'R$ 1 de economia anual vale 5,5 (0,66 ÷ 0,12); R$ 1 de estoque liberado vale 1. B vale quase o dobro de A com um quinto do investimento.'],
  ['A vale 33 e B vale 40',0,'Esqueceu o investimento de A (−20), o gasto único de B (−4) e o custo anual de B (−2 × 5,5 = −11).'],
  ['A vale 13 e B vale 36',0,'Esqueceu que o custo anual de B se repete: R$ 2 mi × 5,5 = 11, não 2. B vale 40 − 4 − 11 = 25.']]},
 {p:'Por que o payback não enxerga o Projeto B?',o:[
  ['Porque B é mais arriscado que a máquina',0,'O payback não mede risco de resultado; mede tempo de recuperação. O problema é outro: B não tem o que o payback conta.'],
  ['Porque B não reduz custo; o ganho é capital devolvido ao caixa, que fica no balanço, e o payback só conta economias de custo',1,'B até acrescenta R$ 2 mi por ano de custo. Os R$ 40 mi liberados deixam de custar 12% ao ano (R$ 4,8 mi), mas isso não aparece na demonstração de resultado.'],
  ['Porque o payback de B é muito longo',0,'Não é longo: não existe. Sem economia anual, não há o que dividir.']]},
 {p:'Quanto o S&OP precisa liberar para empatar com a máquina, e quem garante?',o:[
  ['R$ 28 mi; Patrícia, com os três clientes',1,'Liberação − 4 − 11 = 13 (o valor de A) dá 28. Abaixo disso a máquina vale mais. A aprovação deve trazer o número: “se em doze meses não liberar R$ 28 mi, o comitê revê”.'],
  ['R$ 40 mi; o comitê de investimentos',0,'40 é a promessa, não o empate. O comitê não garante liberação de estoque; quem tem os dados é a área de planejamento.'],
  ['R$ 13 mi; Ricardo',0,'13 é o valor da máquina, não a liberação de empate. E Ricardo não controla o estoque.']]}],
 contra:{p:'Ricardo: “capital liberado é dinheiro de papel; no ano seguinte o estoque volta. A máquina eu toco, vejo e meço.” A melhor resposta:',o:[
  ['Aprovar com meta verificável: R$ 28 mi em doze meses, medidos todo mês; abaixo disso, o comitê revê. A máquina também tem premissa: os R$ 6 mi por ano',1,'Aceita o risco que Ricardo levanta, dá a ele o que ele valoriza (um número para cobrar) e lembra que A não é certeza.'],
  ['O estoque nunca volta depois do S&OP',0,'Volta, se a previsão semanal virar mutirão de fim de ano. A liberação só é permanente se o processo mudar; por isso precisa de meta e revisão.'],
  ['Ignorar: a régua já provou que B vale mais',0,'A régua prova o valor se os R$ 40 mi aparecerem. A objeção de Ricardo é justamente sobre isso, e merece uma resposta com número.']]}},
vida:{q:[
 {p:'O que cresceu mais, e onde foi parar?',o:[
  ['A receita: +50%',0,'A receita cresceu 50%, mas o capital cresceu 80% (de 1.000 para 1.800). Cada real de venda nova exigiu mais capital do que antes.'],
  ['O capital: +80%, sobretudo nas lojas novas (R$ 480 mi, 60% do capital novo)',1,'Cada loja prende cerca de R$ 4 mi (reforma, equipamentos, estoque inicial) antes de vender. O sortimento vem depois (R$ 245 mi): perfumaria gira devagar em todas as 320 lojas.'],
  ['O lucro: +25%',0,'O lucro foi o que menos cresceu (240 para 300). Cresceu menos que a receita e muito menos que o capital.']]},
 {p:'O retorno médio caiu de 24% para 16,7%, ainda acima de 12%. Isso prova que…',o:[
  ['O plano deve ser aprovado: a rede rende acima do custo de capital',0,'Prova que a rede, no total, cria valor. Não diz nada sobre o capital que acabou de entrar, porque a média o mistura com as lojas antigas.'],
  ['A rede cria valor, não que o crescimento criou: a média mistura o capital antigo com o novo',1,'Rogério pode usar a média para defender a rede; não para defender o plano. A queda de 24% para 16,7% é o primeiro sinal de que o capital novo rende menos.'],
  ['A rede destrói valor, porque o retorno caiu',0,'16,7% ainda é maior que 12%: a rede como um todo cria valor. O problema está escondido dentro da média.']]},
 {p:'O capital novo…',o:[
  ['Rende 7,5% (60 ÷ 800) contra 12% de custo: R$ 36 mi por ano de valor perdido; empata se o lucro novo chegar a R$ 96 mi',1,'De cada R$ 100 que entraram, voltaram R$ 7,50, contra R$ 12 de custo. O valor econômico da rede caiu de 120 para 84 enquanto o lucro batia recorde.'],
  ['Rende 16,7%, acima do custo',0,'16,7% é a média de tudo (300 ÷ 1.800). O capital novo rende 60 ÷ 800 = 7,5%.'],
  ['Rende 30% (300 ÷ 1.000)',0,'Mistura o lucro total com o capital antigo. A pergunta é: do dinheiro que entrou (800), quanto voltou em lucro novo (60)?']]}],
 contra:{p:'Tiago: “loja nova leva três anos para amadurecer; julgar o capital novo hoje é julgar um aluno pela nota do primeiro dia.” A melhor resposta:',o:[
  ['Concordar e aprovar: as lojas vão amadurecer',0,'O argumento é verdadeiro e não tem número. Sem número e data, é uma promessa sem custo para quem a faz.'],
  ['Concordar e pedir o número com data: R$ 96 mi de lucro novo, por safra de lojas; até lá, crescer em fases, com menos capital por loja',1,'Transforma o argumento de Tiago num compromisso verificável, exatamente o que Beatriz pediu, sem parar o crescimento.'],
  ['Discordar: loja nova deveria render desde o primeiro ano',0,'Não é verdade em varejo, e Tiago sabe disso. Discordar do que é verdade perde a sala.']]}}};

// ============ componentes ============
function slider(label,S,key,min,max,step,f,rerender){
  const id='in-'+key;
  const val=el('span',{class:'val'},f(S[key]));
  const inp=el('input',{type:'range',id,min,max,step,value:S[key],oninput:e=>{S[key]=+e.target.value;val.textContent=f(S[key])},onchange:e=>{S[key]=+e.target.value;rerender(true)}});
  return el('div',{class:'ctl'},el('label',{for:id},label,' ',val),inp);
}
function kpi(l,v,cls=''){return el('div',{class:'kpi'},el('div',{class:'l'},l),el('div',{class:'v '+cls},v))}
function diag(kind,title,text){return el('div',{class:'diag '+kind},el('span',{class:'t'},title),text)}
function quiz(label,S,key,opts,ans,rerender,okText,koText){
  const q=el('div',{class:'q'},el('span',{class:'lbl'},label));
  const chips=el('div',{class:'chips'},...opts.map(o=>el('button',{class:'chip','aria-pressed':String(S[key]===o),onclick:()=>{S[key]=o;rerender()}},o)));
  const fb=el('div',{class:'feedback'+(S[key]?' show '+(S[key]===ans?'ok':'ko'):'')},S[key]?(S[key]===ans?okText:koText):'');
  return el('div',{},q,chips,fb);
}
function isoChart(points,levels){
  const W=560,H=300,px=56,py=20,xmax=4.5,ymax=22;
  const X=x=>px+(x/xmax)*(W-px-16), Y=y=>H-py-18-(y/ymax)*(H-py-38);
