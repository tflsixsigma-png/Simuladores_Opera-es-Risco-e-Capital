<title>Vitta Cosméticos · Roteiro de análise · Sessão 2</title>
<style>
:root{--bg:#0B1220;--bg2:#121C30;--bg3:#1A2742;--fg:#F5F2EA;--mut:#BFC8D6;--line:#2E3D5C;

.on-amb{color:var(--amb)}.on-blu{color:var(--blu)}.dim{opacity:.38}

<header>
 <div class="hrow"><div><div class="kick">Operações, Risco e Capital · Sessão 2 · Risco e resiliência</div><h1>Vitta Cosméticos: roteiro de análise do comitê</h1></div><div class="steps" id="steps"></div></div>
 <div class="tools"><label style="cursor:pointer"><input type="checkbox" id="livre" style="accent-color:var(--amb)"> Navegação livre (uso do professor)</label><span class="note">Números do caso (Exhibits 1 a 4). As decisões do grupo ficam registradas apenas neste navegador.</span></div>
</header>

<script>
// ===================== DADOS DO CASO =====================
const FAMS=[
 {k:'fr',n:'Frascos de vidro (linha premium)',rec:120,est:30,tol:15,recMin:20},
 {k:'fg',n:'Fragrâncias exclusivas',rec:180,est:60,tol:15,recMin:45},
 {k:'at',n:'Ativos e bases químicas',rec:20,est:30,tol:10},
 {k:'pl',n:'Embalagens plásticas e tampas',rec:30,est:25,tol:10},
 {k:'gr',n:'Cartuchos, rótulos e material gráfico',rec:25,est:20,tol:10}];
FAMS.forEach(f=>{f.sob=f.est+f.tol;f.exp=Math.max(0,f.rec-f.sob)});
const FM=Object.fromEntries(FAMS.map(f=>[f.k,f]));
const PROT=[
 {k:'mapa',n:'Mapa vivo e protocolo de decisão',c:0.8,tipo:'Evita',d:'Reação 25 dias mais cedo em qualquer família exposta'},
 {k:'fonteFr',n:'Segunda fonte: frascos',c:0.6,tipo:'Evita',d:'Moldes na Vidros do Sul para 100% dos itens; tempo para recuperar cai para 20 dias'},
 {k:'fonteFg',n:'Segunda fonte: fragrâncias',c:0.6,tipo:'Evita',d:'Doze fórmulas duplicadas; tempo para recuperar cai para 45 dias'},
 {k:'estoque',n:'Estoque estratégico de frascos',c:0.7,tipo:'Adia',d:'Mais 30 dias de tempo para sobreviver, apenas nos frascos; R$ 4 mi imobilizados'},
 {k:'seguro',n:'Seguro de lucros cessantes',c:1.5,tipo:'Compensa',d:'Cobre 70% da margem perdida a partir do 30.º dia'},
 {k:'padr',n:'Padronização dos frascos',c:1.8/5.5,unico:1.8,tipo:'Evita',d:'Investimento único de R$ 1,8 mi: todos os frascos passam a formatos que a Vidros do Sul já produz; tempo para recuperar cai para 45 dias'}];
const FILO={mapa:'Capacidade dinâmica: perceber e decidir',fonteFr:'Redundância',fonteFg:'Redundância',estoque:'Redundância',seguro:'Transferência do prejuízo',padr:'Redução da complexidade: atua na causa'};
const ORC=2.7, REGUA=5.5, EBITDA=220, DIV=500, COV=2.5, DISP=12, MUNDO=0.15, MARGEM=0.5, REV=0.8;

// ===================== ESTADO =====================
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEF={step:0,grupo:'',livre:false,v:{},q1:{first:null,ok:false},q2:{chance:null,ok:false},q3:{prot:{},ok:false},q4:{ok:false,d:null},q5:{rolled:0,ok:false},q6:{chance:null,d:null,ok:false,frase:'',fechado:false},plen:['','','','']};
let S=JSON.parse(JSON.stringify(DEF));try{Object.assign(S,JSON.parse(LS.get('vitta-roteiro')||'{}'))}catch(e){}

const qp=new URLSearchParams(location.search).get('quadro');if(qp!==null)S.step=parseInt(qp);
const fmt=(v,d=0)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const mi=(v,d=1)=>'R$ '+fmt(v,d)+' mi';
const sg=(v,d=1)=>(Math.abs(v)<0.05?'':v>=0?'+':'−')+mi(Math.abs(v),d);
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x==null?'':x.nodeType?x:document.createTextNode(x)));return e};
const H=(s)=>{const d=document.createElement('div');d.innerHTML=s;return d};

// ===================== CÁLCULOS =====================
function janelas(prot){const out={};FAMS.forEach(f=>{let rec=f.rec,sob=f.sob;
 if(prot.mapa&&f.exp>0)rec-=25;if(f.k==='fr'&&prot.fonteFr)rec=Math.min(rec,f.recMin);if(f.k==='fr'&&prot.padr)rec=Math.min(rec,45);if(f.k==='fg'&&prot.fonteFg)rec=Math.min(rec,f.recMin);if(f.k==='fr'&&prot.estoque)sob+=30;
 out[f.k]=Math.max(0,rec-sob)});return out}
const custoProt=p=>PROT.filter(x=>p[x.k]).reduce((a,x)=>a+x.c,0);
const episodio=d=>d*REV*MARGEM;
const epLiq=(d,seg)=>episodio(d)-(seg?0.7*episodio(Math.max(0,d-30)):0);
const diasElim=(sel)=>{const j=janelas(sel);return (FM.fr.exp-j.fr)+(FM.fg.exp-j.fg)};
const perda=(dias,seg)=>epLiq(dias,seg)+(dias>0?2:1);
function decada(seed,prot){let s=seed>>>0;const rnd=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
 const jan=janelas(prot),c=custoProt(prot),anos=[];
 for(let y=1;y<=10;y++){const ev=rnd()<MUNDO,fam=rnd()<0.5?'fr':'fg';let loss=ev?perda(jan[fam],prot.seguro):0;let e=EBITDA-c-loss;const ratio=DIV/e,cov=ratio>COV;if(cov)e-=DISP;anos.push({y,ev,fam,loss,ebitda:e,ratio,cov})}
 return {anos,jan,c,total:anos.reduce((a,x)=>a+x.ebitda,0),covs:anos.filter(x=>x.cov).length,evs:anos.filter(x=>x.ev).length}}
function seedOf(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const chanceAtual=()=>S.q6.chance??S.q2.chance??15;

// ===================== CÓDIGO =====================
const PERMKEYS=['fr','fg','at','pl','gr'];
function encode(){const fi=Math.max(0,PERMKEYS.indexOf(S.q1.first));const ch=Math.round(chanceAtual()*10);const pb=PROT.reduce((a,p,i)=>a|(S.q3.prot[p.k]?1<<i:0),0);
 let v=BigInt(fi);v=v*251n+BigInt(ch);v=v*64n+BigInt(pb);v=v*3n+BigInt(S.q4.d??0);v=v*3n+BigInt(S.q6.d??0);v=v*36n+BigInt(S.q5.rolled%36);
 return v.toString(36).toUpperCase().padStart(6,'0')}
function decode(code){try{let v=BigInt(parseInt(code.trim().toLowerCase(),36));
 const seed=Number(v%36n);v/=36n;const d6=Number(v%3n);v/=3n;const d4=Number(v%3n);v/=3n;const pb=Number(v%64n);v/=64n;const ch=Number(v%251n)/10;v/=251n;const fi=Number(v);
 const prot={};PROT.forEach((p,i)=>prot[p.k]=!!(pb&(1<<i)));return {first:PERMKEYS[fi]||'fr',chance:ch,prot,d4,d6,seed}}catch(e){return null}}

// ===================== COMPONENTES =====================
function campo(key,correct,opts={}){let t=opts.fmt?opts.fmt(correct):fmt(correct,opts.dec??0);
 if(!opts.fmt){if(opts.ph==='dias')t+=' d';else if(opts.ph==='R$ mi')t='R$ '+t+' mi';else if(opts.ph==='%')t+='%';else if(opts.ph==='R$ mil')t='R$ '+t+' mil';}
 return el('span',{class:'calc'},t)}
const verif=()=>null;
const chip=(t,on,fn,dis)=>{const b=el('button',{class:'chip','aria-pressed':String(!!on),onclick:fn});b.append(t);if(dis)b.disabled=true;return b};
const kpi=(l,v,c)=>el('div',{class:'kpi'},el('div',{class:'l'},l),el('div',{class:'v '+(c||'')},v));
const com=(...ps)=>el('div',{class:'com'},el('h4',{},'Comentário'),...ps.map(p=>H('<p>'+p+'</p>').firstChild));
const con=(t,s)=>el('details',{class:'con'},el('summary',{},'Referência · '+t),H('<div class="b">'+s+'</div>').firstChild);
function nav(ok){return el('div',{class:'row'},el('button',{class:'btn sec',onclick:()=>{S.step=Math.max(0,S.step-1);go()}},'← Quadro anterior'),el('button',Object.assign({class:'btn',onclick:()=>{S.step++;go()}},(ok||S.livre)?{}:{disabled:true}),'Quadro seguinte →'))}
function eq(active,text){const t=(k,s)=>el('span',{class:active.includes(k)?'on-'+(k==='fc'?'amb':'blu'):'dim'},s);const fr=(n,d)=>el('span',{class:'fr'},el('span',{},t('fc','FC'+n)),el('span',{},'(1 + ',t('i','i'),')',d));
 return el('div',{class:'eq'},el('div',{class:'f'},el('span',{},'Valor ='),fr('₁',''),' + ',fr('₂','²'),' + ',fr('₃','³'),' + …'),el('div',{class:'t'},text))}

// ===================== QUADROS =====================
const T=[];

// ---------- 0 ----------
T.push({t:'Apresentação',r(){return el('div',{},
 eq(['fc','i'],'A equação do valor, referência de todos os quadros.'),
 el('h2',{},'Roteiro de análise'),
 el('p',{class:'lead'},'Este roteiro organiza a análise do caso Vitta Cosméticos em seis quadros, na ordem das perguntas do comitê. Cada quadro apresenta os dados do exhibit correspondente, os conceitos necessários, o cálculo feito pela plataforma, com a fórmula à vista, e a decisão que o quadro exige. O comentário que segue cada decisão a discute à luz das Notas de Ensino 2. Recomenda-se percorrer os quadros com o caso impresso; o valor do trabalho está em interpretar os números e defender a decisão.'),
 el('div',{class:'card'},el('h3',{},'Identificação do grupo'),el('input',{type:'text',placeholder:'Grupo (ex.: Grupo 2)',value:S.grupo,oninput:e=>{S.grupo=e.target.value;save();const b=document.getElementById('btn-q1');if(b)b.disabled=!(S.grupo.trim()||S.livre)}}),
  el('p',{class:'note',style:'margin-top:8px'},'A identificação determina a década simulada no Quadro 5 e consta do código gerado no Quadro 6 para a plenária.')),
 el('div',{class:'card'},el('h3',{},'Parâmetros do caso'),el('table',{},
  el('tr',{},el('td',{},'Custo de capital (após imposto)'),el('td',{class:'n'},'12% a.a.'),el('td',{},'Régua: R$ 1 de lucro recorrente ≈ R$ 5,5 de valor'),el('td',{class:'n'},'0,66 ÷ 0,12')),
  el('tr',{},el('td',{},'Receita por dia, linha premium'),el('td',{class:'n'},'R$ 0,8 mi'),el('td',{},'Margem de contribuição, linha premium'),el('td',{class:'n'},'50%')),
  el('tr',{},el('td',{},'Custo de carregamento de estoque'),el('td',{class:'n'},'17% a.a.'),el('td',{},'Orçamento da proposta de Renata'),el('td',{class:'n'},'R$ 2,7 mi/ano')),
  el('tr',{},el('td',{},'EBITDA 2026 · dívida líquida'),el('td',{class:'n'},'220 · 500'),el('td',{},'Covenant: dívida ÷ EBITDA ≤ 2,5; dispensa ≈ R$ 12 mi'),el('td',{class:'n'},'2,27× em 2026')))),
 el('div',{class:'row'},el('span'),(()=>{const b=el('button',{class:'btn',id:'btn-q1',onclick:()=>{if(!S.grupo.trim())S.grupo='Grupo';S.step=1;go()}},'Quadro 1 →');b.disabled=!(S.grupo.trim()||S.livre);return b})()))}});

// ---------- 1 ----------
T.push({t:'Quadro 1 · Exposição',r(){
 const tb=el('table',{},el('tr',{},el('th',{},'Família (Exhibit 1)'),el('th',{class:'n'},'Tempo para recuperar'),el('th',{class:'n'},'Estoque'),el('th',{class:'n'},'Atraso tolerado pelas redes'),el('th',{class:'n'},'Tempo para sobreviver'),el('th',{class:'n'},'Exposição (dias)')));
 FAMS.forEach(f=>tb.append(el('tr',{},el('td',{},f.n),el('td',{class:'n'},f.rec+' d'),el('td',{class:'n'},f.est+' d'),el('td',{class:'n'},f.tol+' d'),el('td',{class:'n'},campo('sob_'+f.k,f.sob,{grp:'q1',ph:'dias',abs:0,tol:0})),el('td',{class:'n'},campo('exp_'+f.k,f.exp,{grp:'q1',ph:'dias',abs:0,tol:0})))));
 const decis=el('div',{class:'card'},el('h3',{},'Decisão 1',el('span',{class:'sub'},'A que família a primeira proteção deve ser dirigida?')),
  el('div',{class:'chips'},...FAMS.map(f=>chip(f.n,S.q1.first===f.k,()=>{if(!S.q1.ok){S.q1.first=f.k;rr()}},S.q1.ok))),
  el('div',{class:'row'},el('span',{class:'note'},S.q1.ok?'Decisão registrada.':'Escolha e confirme.'),chip(S.q1.ok?'Confirmada':'Confirmar decisão',S.q1.ok,()=>{if(S.q1.first){S.q1.ok=true;rr()}},S.q1.ok||!S.q1.first)));
 let c=null;
 if(S.q1.ok){const f=S.q1.first;const ps=[];
  if(f==='fg')ps.push('O grupo dirigiu a primeira proteção às fragrâncias, família com a maior janela (105 dias). A escolha segue o critério do mapa, e não o do último choque: o incêndio ocorreu na vidraria, mas a exposição é maior onde o tempo para recuperar é mais longo e ninguém observou. Interessa à plenária saber o que levou o grupo a essa ordem.');
  else if(f==='fr')ps.push('O grupo dirigiu a primeira proteção aos frascos, onde ocorreu o incêndio. O quadro mostra, porém, que a janela das fragrâncias é maior (105 dias contra 75): reformular doze fórmulas com outra casa e refazer os testes exige seis meses, e a Vitta aguenta setenta e cinco dias. É a decisão que o comitê da Vitta tomaria sem o mapa, e é a que o mapa corrige.');

<p><b>De onde vêm os números.</b> No Quadro 1, a janela de cada família é o número de dias em que a Vitta fica sem entregar: tempo para recuperar menos tempo para sobreviver. No Quadro 2, cada dia sem entregar custa R$ 0,8 mi de receita, da qual metade é margem de contribuição. Logo, cada dia de janela custa R$ 0,4 mi de margem. O episódio é a janela vezes R$ 0,4 mi.</p>
<p><b>Família por família.</b> Sem proteção: frascos, ${fmt(FM.fr.exp,0)} dias × 0,4 = R$ ${fmt(epFrA,0)} mi; fragrâncias, ${fmt(FM.fg.exp,0)} dias × 0,4 = R$ ${fmt(epFgA,0)} mi. Com a combinação escolhida: frascos, ${fmt(jan.fr,0)} dias de janela, R$ ${fmt(epFrD,1)} mi; fragrâncias, ${fmt(jan.fg,0)} dias, R$ ${fmt(epFgD,1)} mi.${P.seguro?' O seguro não muda os dias: devolve 70% da margem dos dias que passam do 30.º. Nos frascos, 75 − 30 = 45 dias × 0,4 × 70% = R$ 12,6 mi devolvidos; nas fragrâncias, 75 dias × 0,4 × 70% = R$ 21 mi. Por isso o episódio cai sem que a janela feche.':''}</p>
<p><b>Por que a média das duas famílias.</b> A conta supõe uma parada de cada vez. Se ela vier nos frascos, a Vitta perde o episódio dos frascos; se vier nas fragrâncias, o das fragrâncias. Como ninguém sabe qual será, a conta dá peso igual às duas. Se o grupo acredita que uma família é mais exposta que a outra, vale levar o argumento à plenária: os pesos mudam, a lógica não.</p>
<p><b>O que o número significa.</b> A margem preservada, R$ ${fmt(dEp,1)} mi, é o que a combinação poupa <i>cada vez</i> que uma parada acontece. Ainda não depende da chance: é o tamanho do benefício, não a sua frequência.</p>
<p><b>Erro comum.</b> Somar os dois episódios (R$ ${fmt(epFrA+epFgA,0)} mi), como se as duas famílias parassem no mesmo ano. O caso não sustenta essa hipótese.</p>`));

<p><b>A pergunta muda.</b> O Passo 2 respondeu quanto a combinação vale na média. O banco não olha a média: olha o ano. No ano da parada, o EBITDA cai pelo episódio inteiro, e é nesse ano que o compromisso com os bancos é medido.</p>
<p><b>O limite.</b> O contrato exige dívida ÷ EBITDA de no máximo 2,5 vezes. Com dívida de R$ 500 mi, o EBITDA não pode ficar abaixo de 500 ÷ 2,5 = R$ 200 mi. Hoje ele é R$ 220 mi: a folga é de R$ 20 mi. Qualquer perda maior que isso rompe o limite.</p>
<p><b>Sem proteção.</b> 220 − ${fmt(eA,0)} (episódio médio) = ${fmt(ebA,0)}; 500 ÷ ${fmt(ebA,0)} = ${fmt(ratioA,2)} vezes. ${covA?'Rompe o limite.':'Não rompe.'}</p>
<p><b>Com a combinação.</b> 220 − ${fmt(c3,2)} (o custo da combinação também reduz o EBITDA, todo ano) − ${fmt(eD,0)} (episódio médio que sobra) = ${fmt(ebD,0)}; 500 ÷ ${fmt(ebD,0)} = ${fmt(ratioD,2)} vezes. ${covD?'Ainda rompe.':'Não rompe.'}</p>
<p><b>O resultado.</b> ${dDi?`A combinação muda o lado do limite: evita uma dispensa de R$ 12 mi no ano da parada. Como esse ano acontece com chance de ${pct}, o valor anual é 12 × ${pct} = ${sg(p3,2)}.`:covA?'A combinação não tira a Vitta do lado errado do limite: a dispensa acontece de qualquer forma, e o resultado deste passo é zero. Uma combinação que feche mais dias resolveria.':'Sem proteção a Vitta já não rompe o limite nessa média; o resultado deste passo é zero.'}</p>
<p><b>Por que é um degrau.</b> Uma perda de R$ 19 mi não custa nada além dela mesma. Uma de R$ 21 mi custa a perda mais R$ 12 mi de dispensa, e ainda juros maiores e restrições a dividendos e investimentos. A média do Passo 2 não enxerga esse salto; por isso ele tem conta própria.</p>

  const rows=[['Primeira proteção dirigida a',g=>FM[g.d.first].n.split(' (')[0]],['Chance adotada',g=>fmt(g.d.chance,1)+'%'],['Combinação',g=>PROT.filter(p=>g.d.prot[p.k]).map(p=>lab[p.k]).join(', ')||'nenhuma'],['Custo anual',g=>mi(custoProt(g.d.prot))],['Janela remanescente',g=>{const j=janelas(g.d.prot);return `${j.fr} + ${j.fg} = ${j.fr+j.fg} dias`}],['Decisão no Quadro 4',g=>['levou','levou reduzida','arquivou'][g.d.d4]],['Decisão final',g=>['aprovou','aprovou reduzida','arquivou'][g.d.d6]]];
  const tb=el('table',{class:'cmp'},el('tr',{},el('th',{},''),...groups.map(g=>el('th',{},'Grupo '+(g.i+1)))));rows.forEach(([l,fn])=>tb.append(el('tr',{},el('td',{},el('b',{},l)),...groups.map(g=>el('td',{},fn(g))))));
  const decs=groups.map(g=>decada(seedP,g.d.prot)),nada=decada(seedP,{});
  const tb2=el('table',{class:'cmp'},el('tr',{},el('th',{},'Mesma década'),...groups.map(g=>el('th',{},'Grupo '+(g.i+1))),el('th',{},'Sem proteção')),
   el('tr',{},el('td',{},el('b',{},'Paradas')),...decs.map(d=>el('td',{},d.evs)),el('td',{},nada.evs)),

   el('tr',{},el('td',{},el('b',{},'EBITDA da década')),...decs.map(d=>el('td',{},mi(d.total,0))),el('td',{},mi(nada.total,0))));
  const grid=d=>el('div',{class:'years'},...d.anos.map(a=>el('div',{class:'yr'+(a.ev?' ev':'')+(a.cov?' cov':'')},'ano '+a.y,el('b',{},fmt(a.ebitda,0)),a.ev?('parada: '+(a.fam==='fr'?'frascos':'fragrâncias')):'—',a.cov?el('div',{style:'color:var(--red);font-weight:700'},'covenant'):'')));
  cmp=el('div',{},el('div',{class:'card'},el('h3',{},'Decisões dos comitês'),tb),el('div',{class:'card'},el('h3',{},'A mesma década para todos'),tb2,...groups.map((g,k)=>el('div',{style:'margin:10px 0'},el('div',{class:'note'},'Grupo '+(g.i+1)),grid(decs[k]))),el('div',{style:'margin:10px 0'},el('div',{class:'note'},'Sem proteção'),grid(nada))))}
 return el('div',{},eq(['fc','i'],'Plenária: as decisões dos comitês, lado a lado, submetidas à mesma década.'),
  el('h2',{},'Plenária'),el('p',{class:'lead'},'Informe os códigos dos grupos. A década é sorteada a partir dos códigos informados, igual para todos.'),

  el('div',{class:'card'},el('h3',{},'Análise de referência'),H('<div style="font:18px/1.55 var(--ser)"><p>Janela: frascos 75 dias, fragrâncias 105; as demais famílias em zero. Episódios: R$ 30 mi e R$ 42 mi. Chance do portfólio: 15%, uma parada a cada 7 anos. A proposta integral se paga com uma parada a cada 11 anos: passa na crença de Daniel e não na de Marcos (uma a cada 30).</p><p>A combinação de menor custo que fecha as duas janelas é a segunda fonte de fragrâncias (0,6 por ano) com a padronização dos frascos (R$ 1,8 mi uma vez, cerca de 0,33 por ano pela régua): 0,93 por ano. A 15%, a média dá 5,4 − 0,93 = +4,5 por ano; o ano ruim acrescenta +1,8 (sem proteção, uma parada típica viola o covenant: 500 ÷ 184 = 2,7×); total ≈ +6,3 por ano, cerca de R$ 35 mi de valor. Somando a média e o ano da parada, ela se paga com uma parada a cada 52 anos (48 ÷ 0,93) e é positiva também na crença de Marcos (+0,7 por ano): a decisão deixa de depender de quem tem razão sobre a chance. Se o comitê acolher o argumento de Paula, a segunda fonte nas duas famílias (1,2 por ano) fecha as mesmas janelas: total ≈ +6,0 por ano, cerca de R$ 33 mi. A diferença, em torno de R$ 1,5 mi de valor, é o preço que a Vitta pagaria pelo frasco exclusivo; é essa a pergunta a fazer a Paula.</p><p>O estoque sai: apenas adia, custa R$ 23 mil por dia e reabre a discussão de 2026. O mapa e protocolo (0,8 por ano) não fecham dias adicionais nessas combinações; acrescentá-lo reduz o total para cerca de +5,5 por ano (R$ 30 mi). Sua defesa está fora da conta de dias: é ele que garante a reação rápida que a segunda fonte e a padronização pressupõem, e é a única proteção contra janelas que ainda não estão no mapa. É a decisão em que a régua menos ajuda e o julgamento mais pesa.</p><p>Uma recomendação defensável: "Investimos R$ 1,8 milhão uma vez e pagamos R$ 0,6 milhão por ano para fechar 180 dias de janela nos frascos e nas fragrâncias, e R$ 0,8 milhão por ano para que a reação a qualquer parada aconteça em dias, e não em semanas. Isso reduz um custo esperado de R$ 5,4 milhões por ano e afasta o ano em que o lucro cai R$ 30 a 42 milhões e o compromisso com os bancos se rompe. Dono do risco: a diretoria de operações. O mapa será revisto a cada lançamento e a cada contrato de fornecimento crítico."</p></div>')))}};
